P.verizon = { title:"Verizon", cat:"Companies", tag:"Verizon Communications Inc. · VZ · Pig · EBITA rank #7",
infobox: ib("Verizon Communications Inc. (VZ)", [["Tranche","Pig"],["EBITA rank","#7 of 10 ($32.45B)"],["Fiscal year","Ends Dec 31"],["CEO","Dan Schulman (since Oct 4, 2025)"],["Key project","ISAC — towers that sense"],["Camera line","“Verizon wants its towers to see, not just talk.”"]]),
body:'<p><b>Verizon</b> is a phone carrier — it runs the mobile network and the fiber lines. It is not a data-center builder. Its part in the AI buildout is selling connectivity to the companies that are building data centers: fiber and edge capacity (network gear close to the data center) through its AI Connect program. Its spending is falling after the big C-band spectrum build, and it carries the heavy debt typical of a legacy telecom.</p>'+
'<h2>1. At a Glance</h2><p>2026 CapEx guide $16.0–16.5B, midpoint down 4.4% vs 2025 ($17B). Signal: <b>MODERATING / PEAK-ish</b> — spending is past its peak and easing down. Financing verdict: high absolute debt, but funded by operating cash flow (legacy telecom leverage, not a 2026 AI spending spike).</p>'+
'<h2>2. Spending</h2><p>CapEx by year ($B): 2022 $23.09 · 2023 $18.77 · 2024 $17.09 · 2025 $17.01 · 2026 guide $16.0–16.5B. 2025 was 0.74× 2022 — declining after the C-band peak. Verizon discloses no separate R&amp;D line (that does not mean R&amp;D is $0 — it is not broken out). Q3 2026 CapEx was $3.72B. No last-four-quarters CapEx series exists in the sheet.</p>'+
'<h2>3. Profitability</h2><p>Gross margin (the share of revenue left after the direct cost of providing the service): 2022 56.8% · 2023 59.1% · 2024 60.0% · 2025 58.9% · 2026 not reported. Gross profit / revenue ($B): 2022 $77.70 / $136.84 · 2023 $79.17 / $133.97 · 2024 $80.88 / $134.79 · 2025 $81.43 / $138.19. Caution: Verizon and '+wl('att','AT&T')+' do not report a single gross-profit line — these figures come from data aggregators (revenue minus cost-of-services-type costs). Do not compare telecom gross margin directly with chip gross margin. Do not use a competing ~79% series that conflicts with the ~57–60% range from the main aggregators.</p>'+
'<h2>4. Financial Position</h2><p>Revenue, free cash flow (cash left after spending), cash and short-term investments, and total debt ($B). Total debt means borrowings plus finance leases, not counting operating leases.</p>'+finTable([["2022","$136.84","$10.40","$2.60","$150.64"],["2023","$133.97","$12.91","$2.06","$150.67"],["2024","$134.79","$18.92","$4.19","$144.01"],["2025","$138.19","$19.68","$19.05","$158.15"]])+'<p>Net debt by year: 2022 $148.04B · 2023 $148.61B · 2024 $139.82B · 2025 $139.10B. Operating cash flow n/r in this table.</p>'+
'<h2>5. Operations</h2><p>Fiber and edge for hyperscaler data centers — a TIE-IN, <b>not</b> a data-center campus. AI Connect (Verizon’s program selling fiber and edge capacity to AI builders): about $4B signed in six months to Oct 2026, including a dark-fiber deal with AWS (Amazon’s cloud arm) worth more than $2B announced Oct 26, 2026, and a dark-fiber deal with Google worth more than $1B in Jul 2026. Corning fiber supply: more than 80 million fiber miles, 2027–2032. Power (MW) n/r. Verizon said significant AI Connect revenue had not begun yet, with impact expected to start in 2027.</p>'+
'<h2>6. Outlook</h2><p>2026 CapEx guide $16.0–16.5B, reaffirmed, down $0.5–1.0B vs 2025’s $17B. No AI / data-center split is disclosed. Backlog (RPO — money customers have committed to pay): no comparable figure found — a gap. Cuts or pauses: no cut announced; the guide is down vs 2025, which is real moderation, not a pause.</p>'+
'<h2>7. Notes, Risks, and Sources</h2><ul><li>Some summaries show long-term debt only — total debt is higher. Total debt (not long-term only) for 2022–2025 is as shown in Section 4.</li><li>One data source (TIKR) gives a slightly different free-cash-flow series ($18.7B in 2023, $19.8B in 2024, $20.1B in 2025) — a definition difference; do not average the two series.</li><li>Q3 2026: revenue $34.31B, operating margin 25.2%, consolidated net margin 15.5%, adjusted EBITDA margin 40.2%.</li></ul>'+
'<h2>8. Consensus — Latest Full Year</h2><p>2025 — Revenue $138.19B · Free cash flow $19.68B · Cash &amp; short-term investments $19.05B · CapEx $17.01B · R&amp;D not separately disclosed · Gross margin 58.9%. Share price Nov 5, 2026 close: $46.12.</p>'+
'<h2>9. EBITA</h2><p>Rank #7 of 10. Trailing-twelve-months EBITA <b>$32.45B</b> (operating income $29.08B + amortization $3.38B, total intangible amortization). Period: Oct 1, 2025 to Sep 30, 2026. EBITA share: 3.5% of the ten-company total.</p>'+
'<h2>10. Latest Balance Sheet (Sep 30, 2026)</h2><p>Total assets $415.5B · Cash $4.5B · Short-term investments n/a · Receivables (money owed by customers) $26.4B · Inventory $2.8B · Property, plant and equipment $125.1B · Long-term investments $0.8B · Other $29.1B.</p>'+
'<h2>11. Assets History</h2><p>Total assets: FY2015 $244.2B · FY2020 $316.5B · FY2025 $404.3B · Q3 2026 $415.5B.</p>'+
'<h2>12. Assets Year-on-Year</h2><p>FY2025 total assets up 5.1% on the year. Slow, steady growth — +0.2% (2023), +1.2% (2024), +5.1% (2025); the 2021 jump of +15.8% is the outlier in the series.</p>'+
'<h2>13. Top Shareholders</h2><p>Top 5 holders, shares held, Q3 2026 (Sep 30, 2026) vs 2020 <span class="label proven">PROVEN · SEC 13F</span>. 1. '+wl('blackrock','BlackRock')+' 404.6M vs 298,750,519. 2. Vanguard Capital Mgmt 271.9M vs 325,949,036. 3. State Street 210.6M vs 161,029,777. 4. Charles Schwab Investment Management 136.0M vs 38,318,476. 5. Geode 108.1M vs 64,660,894. Note: Vanguard split into two separately filing advisers in Jan 2026; the 2020–2025 figures are the old combined Vanguard Group, the 2026 figure is Vanguard Capital Mgmt only — the apparent drop is not selling. The sheet’s Section 13 shows slightly lower Q2-basis figures for BlackRock (398,216,158), Vanguard (259,000,000), and Schwab (127,770,000); the Q3 figures above are the newer counts.</p>'+
'<h2>Stakes It Holds</h2><p>Verizon holds stakes in <b>3 partners</b> (cash out — it spent to buy in), plus 3 shared cables: '+wl('ast','AST SpaceMobile')+' — $35M of notes converted in Jan/Feb 2025, share count n/r <span class="label proven">PROVEN</span>; a 50:50 fiber joint venture with BT (entity: Jasper NewCo Ltd), with Verizon paying BT a $625M equalization payment — announced Jun 29, 2026, closing 2027 <span class="label proven">PROVEN, announced</span>; co-owner of the E2A subsea cable, in build, ownership % n/r (existence <span class="label proven">PROVEN</span>). The three legacy subsea cables co-owned with '+wl('att','AT&T')+' — Australia-Japan Cable (in service since 2001), Asia-Pacific Cable Network 2, and Trans-Pacific Express <span class="label reported">REPORTED</span>, % n/r. Verizon is also a founder of the three-carrier '+wl('satellite','Satellite Joint Venture')+' with '+wl('att','AT&T')+' and T-Mobile — see that page. Watchlist: a reported 10% stake in Yahoo Inc. was not verified in this sweep and needs a filings check.</p>'+
'<h2>The Test</h2><p>Verizon has no company-specific sell test in this project. The story to watch is twofold: ISAC (Integrated Sensing and Communication) — turning cell towers into sensors that can see what’s around them like radar while still carrying signal — and whether the AI Connect fiber deals turn into real revenue from 2027, as Verizon expects.</p>'+
'<h2>Who’s in Charge</h2><p>Dan Schulman, chief executive officer since Oct 4, 2025 (previously CEO of PayPal).</p>'+
'<h2>On Camera</h2><p><b>TAUGHT, not answered back</b> (drill 9, Nov 18) — flagged “Run it back.” Brenden said “Idk” and was taught: ISAC means the towers also sense what’s around them like radar while carrying signal. Camera line: “Verizon wants its towers to see, not just talk.” He reacted with a heart emoji.</p>' };

P.att = { title:"AT&T", cat:"Companies", tag:"AT&T Inc. · T · Pig · EBITA rank #8",
infobox: ib("AT&T Inc. (T)", [["Tranche","Pig"],["EBITA rank","#8 of 10 ($23.81B)"],["Fiscal year","Ends Dec 31"],["CEO","John Stankey"],["Key project","Open RAN — mix-and-match tower parts"],["Headline","“Big 3 cellular is going interstellar”"],["Camera line","“AT&T wants to buy tower parts like Lego bricks instead of one locked box.”"]]),
body:'<p><b>AT&amp;T</b> is a phone carrier — it runs the mobile network and the fiber lines. Like '+wl('verizon')+', it is not a data-center builder; its part in the AI buildout is fiber: supplying the fiber that connects data centers and reaching more than 60 million fiber locations by 2030. This page also carries the three-carrier satellite joint-venture story, under Brenden’s headline “big 3 cellular is going interstellar” — see the '+wl('satellite','Satellite Joint Venture')+' page.</p>'+
'<h2>1. At a Glance</h2><p>2026 capital-investment plan $23–24B; 2027–2028 plan $22–23B per year (midpoint down 4.3% vs 2026). Fiber passed more than 39 million locations, target more than 60 million by 2030 — the build continues, the spending moderates. Signal: <b>MODERATING</b>. Financing verdict: high absolute debt, but funded by operating cash flow (legacy telecom leverage, not a 2026 AI spending spike). (The year-on-year CapEx growth figure vs the 2025 base is a gap — the 2025 base was not found.)</p>'+
'<h2>2. Spending</h2><p>CapEx (cash spending on property, plant and equipment) by year ($B): 2022 $19.626 · 2023 $17.853 · 2024 $20.263 · 2025 $20.842 · 2026 plan $23–24B (capital investment, which is a broader measure than cash CapEx — do not mix the two). About 1.06× 2022 — flat. R&amp;D by year ($B): 2022 $1.24 · 2023 $0.95 · 2024 $0.96 · 2025 $0.84 — flat at about 1% of revenue or below, a negligible share. Q3 2026 CapEx $5.1B; capital investment $5.6B. No last-four-quarters CapEx series exists in the sheet.</p>'+
'<h2>3. Profitability</h2><p>Gross margin (the share of revenue left after the direct cost of providing the service): 2022 57.9% · 2023 59.1% · 2024 59.8% · 2025 59.6% · 2026 not reported. Gross profit / revenue ($B): 2022 $69.89 / $120.74 · 2023 $72.31 / $122.43 · 2024 $73.12 / $122.34 · 2025 $74.83 / $125.65. Caution: AT&amp;T and Verizon do not report a single gross-profit line — these figures come from data aggregators. Do not compare telecom gross margin directly with chip gross margin.</p>'+
'<h2>4. Financial Position</h2><p>Revenue, free cash flow (cash left after spending), cash and short-term investments, and total debt ($B). Total debt means borrowings plus finance leases, not counting operating leases.</p>'+finTable([["2022","$120.74","n/r","n/r","$135.89"],["2023","$122.43","$20.41 (derived)","n/r","$137.33"],["2024","$122.34","$18.47 (derived)","n/r","$123.53"],["2025","$125.65","$19.40","$18.20","$136.10"]])+'<p>Operating cash flow: 2023 $38.31B · 2024 $38.77B · 2025 $40.28B (2022 n/r). Net debt 2025: $117.90B. Debt-definition note: the uniform series (borrowings plus finance leases) gives 2025 total debt of $136.10B; an older sheet series gives $174.0B (net debt $155.8B). Definitions differ — both are preserved, do not average them. Operating lease liabilities 2025: $22.52B; total debt including operating leases 2025: $158.62B.</p>'+
'<h2>5. Operations</h2><p>Fiber supply for AI/data growth — a TIE-IN, <b>not</b> a data-center campus. Corning multiyear fiber/cable deal worth more than $3B, Sep 29, 2026. AT&amp;T target: 60 million fiber locations by 2030. Power (MW) n/r. This is a supply contract, not a named AI data-center campus.</p>'+
'<h2>6. Outlook</h2><p>2026 capital investment $23–24B; 2027–2028 $22–23B per year (midpoint down 4.3% vs 2026, derived). No AI / data-center split is disclosed. Backlog (RPO — money customers have committed to pay): no comparable figure found — a gap. Cuts or pauses: no cut announced; the guide is moderating in 2027–28, which is real moderation, not a pause.</p>'+
'<h2>7. Notes, Risks, and Sources</h2><ul><li>This is the thinnest retrieval in the sheet: free cash flow for 2022–2024 was not retrieved (the 2023–2024 figures are derived, not reported).</li><li>Conflict: one source gives FY2025 long-term debt as $127.1B in one summary and $134.7B in another — verify the long-term split from the 10-K before publishing.</li><li>FY2025 R&amp;D comes from the 2025 annual report’s management discussion text. One aggregator shows $0 R&amp;D as a line-item artifact — not used.</li></ul>'+
'<h2>8. Consensus — Latest Full Year</h2><p>2025 — Revenue $125.65B · Free cash flow $19.40B · Cash &amp; short-term investments $18.20B · CapEx $20.84B · R&amp;D $0.84B · Gross margin 59.6%. Share price Nov 5, 2026 close: $21.82.</p>'+
'<h2>9. EBITA</h2><p>Rank #8 of 10. Trailing-twelve-months EBITA <b>$23.81B</b> (operating income $23.58B + amortization $0.23B, acquisition-related only). Period: Oct 1, 2025 to Sep 30, 2026. EBITA share: 2.5% of the ten-company total.</p>'+
'<h2>10. Latest Balance Sheet (Sep 30, 2026)</h2><p>Total assets $445.9B · Cash $10.8B · Short-term investments n/a · Receivables (money owed by customers) $8.0B · Inventory $2.9B · Property, plant and equipment $132.2B · Long-term investments $1.2B · Other $49.3B.</p>'+
'<h2>11. Assets History</h2><p>Total assets: FY2015 $402.7B · FY2020 $525.8B · FY2025 $420.2B · Q3 2026 $445.9B. FY2022 was $402.9B, down from $551.6B in FY2021 — the WarnerMedia-era step-down is visible in the series (AT&amp;T spun off its WarnerMedia entertainment business).</p>'+
'<h2>12. Assets Year-on-Year</h2><p>FY2025 total assets up 6.4% on the year. Volatile: −27.0% in 2022, +1.0% (2023), −3.0% (2024), +6.4% (2025). 2025 total assets are still below the 2020 level.</p>'+
'<h2>13. Top Shareholders</h2><p>Top 5 holders, shares held, Q3 2026 (Sep 30, 2026) vs 2020 <span class="label proven">PROVEN · SEC 13F</span>. 1. '+wl('blackrock','BlackRock')+' 548.7M vs 485,568,654. 2. Vanguard Capital Mgmt 448.3M vs 556,695,212. 3. State Street 326.6M vs 287,817,755. 4. Geode 177.9M vs 112,461,620. 5. Newport Trust 174.7M vs 196,731,147. Note: Vanguard split into two separately filing advisers in Jan 2026; the 2020–2025 figures are the old combined Vanguard Group, the 2026 figure is Vanguard Capital Mgmt only — the apparent drop is not selling. The sheet’s Section 13 shows slightly higher Q2-basis figures for BlackRock (559,396,053) and Vanguard (453,562,905); the Q3 figures above are the newer counts.</p>'+
'<h2>Stakes It Holds</h2><p>AT&amp;T holds stakes in <b>3 partners</b> (cash out — it spent to buy in), plus 3 shared cables: '+wl('ast','AST SpaceMobile')+' — 6,260,440 shares from a $35M note converted Feb 3, 2025 <span class="label proven">PROVEN</span>; Gigapower — a 50:50 fiber joint venture with BlackRock/GIP (Global Infrastructure Partners), closed May 2023 <span class="label proven">PROVEN</span>, which is to be absorbed by the pending combined fiber joint venture (announced Oct 6, 2026, closing H1 2027, AT&amp;T 50%, with GIP and CPP) — do not double-count the two; DriveNets — 16.6%, with $620M invested in 2025 <span class="label proven">PROVEN</span>. The three legacy subsea cables co-owned with '+wl('verizon')+' — Australia-Japan Cable, Asia-Pacific Cable Network 2, and Trans-Pacific Express <span class="label reported">REPORTED</span>, % n/r. AT&amp;T is also a founder of the three-carrier '+wl('satellite','Satellite Joint Venture')+' with '+wl('verizon')+' and T-Mobile — see that page. AT&amp;T’s own satellite partner is AST SpaceMobile.</p>'+
'<h2>The Test</h2><p>AT&amp;T has no company-specific sell test in this project. The story to watch is the fiber buildout (more than 60 million locations by 2030) and the satellite joint venture — the freshest story in the index: three carriers, one venture, still unnamed, no permanent CEO, no launch date. Brenden’s headline for it: “Big 3 cellular is going interstellar.”</p>'+
'<h2>Who’s in Charge</h2><p>John Stankey, chief executive officer.</p>'+
'<h2>On Camera</h2><p><b>TAUGHT, not answered back</b> (drill 10, Nov 18) — flagged “Run it back.” Brenden said “Idk” and was taught: Open RAN means shared standards so AT&amp;T can mix and match tower parts from different suppliers instead of buying one locked box. Camera line: “AT&amp;T wants to buy tower parts like Lego bricks instead of one locked box.”</p>' };

P.tesla = { title:"Tesla", cat:"Companies", tag:"Tesla, Inc. · TSLA · Pig · EBITA rank #9",
infobox: ib("Tesla, Inc. (TSLA)", [["Tranche","Pig"],["EBITA rank","#9 of 10 ($3.47B)"],["Fiscal year","Ends Dec 31"],["CEO","Elon Musk"],["Key projects","Optimus robots, Static RAM (SRAM), Terafab chip plant"],["Camera line","“Once Optimus is shipping to consumers, the story is realized — sell.”"]]),
body:'<p><b>Tesla</b> makes electric cars, and it is building two more bets: humanoid robots (Optimus) and its own chips. Terafab is Tesla’s planned chip plant in Grimes County, Texas ($16.8B first phase, announced Aug 6, 2026) — it would make Tesla’s own memory chips (Static RAM, or SRAM) so Tesla no longer depends on '+wl('nvidia')+' for the memory its robots and cars need. Tesla’s own supercomputers, Cortex 1 and Cortex 2 at Giga Texas, train its AI. Tesla is the one company in the index with a sell call attached: sell when Optimus ships to consumers. See '+wl('gates','The Tesla Three Gates')+'.</p>'+
'<h2>1. At a Glance</h2><p>2026 CapEx guide about $20B vs 2025 actual $8.5B (+135%), but cut from a prior guide of more than $25B (−20%). Signal: <b>MIXED</b> — a 2026 cut paired with a multi-year rise. Financing verdict: net cash — the AI CapEx is not yet debt-funded.</p>'+
'<h2>2. Spending</h2><p>CapEx by year ($B): 2022 $7.158 · 2023 $8.898 · 2024 $11.342 · 2025 $8.527 · 2026 guide about $20B. R&amp;D by year ($B): 2022 $3.08 · 2023 $3.97 · 2024 $4.54 · 2025 $6.41. R&amp;D as a share of revenue rose every year — 3.8% (2022), 4.1% (2023), 4.6% (2024), 6.8% (2025) — nearly doubling as a share of revenue from 2022 to 2025. Jan–Sep 2026: CapEx $13.021B, R&amp;D $7.078B, combined $20.099B (Q1 2026 CapEx $2.49B, Q2 $5.79B). Warning: 2026 is partial-year only — do <b>not</b> compare it to full prior years.</p>'+
'<h2>3. Profitability</h2><p>Gross margin (the share of revenue left after the direct cost of making the product): 2022 25.6% · 2023 18.2% · 2024 17.9% · 2025 18.0% · 2026 not reported. Gross profit / revenue ($B): 2022 $20.85 / $81.46 · 2023 $17.66 / $96.77 · 2024 $17.45 / $97.69 · 2025 $17.09 / $94.83. The step-down from 25.6% (2022) to about 18% from 2023 onward is explained by price cuts, not AI. The automotive-sales-only margin is lower still (14.5% in 2025); the figures above are the consolidated margin across the whole company.</p>'+
'<h2>4. Financial Position</h2><p>Revenue, free cash flow (cash left after spending), cash and short-term investments, and total debt ($B). Note: total debt here means borrowings only (an older sheet series), not the borrowings-plus-leases definition used for most peers.</p>'+finTable([["2022","$81.46","$7.57","n/r","$2.05"],["2023","$96.77","$4.36","n/r","$4.66"],["2024","$97.69","$3.58","n/r","$7.88"],["2025","$94.83","$6.22","$44.10","$8.15"]])+'<p>Net cash (more cash than debt): $35.95B. Operating cash flow n/r in this table. Including leases, trailing-twelve-months total debt was $16.45B at Sep 2026, with cash and short-term investments of $45.45B.</p>'+
'<h2>5. Operations</h2><ul><li><b>Cortex 1, Giga Texas</b>, Austin, Texas — ALREADY BUILT. More than 105 MW (megawatts — a measure of power) in production; originally about 50,000 '+wl('nvidia','Nvidia')+' H100 chips. Tesla’s own use, no external sale. In production since late 2024.</li><li><b>Cortex 2, Giga Texas</b>, Austin, Texas — ALREADY BUILT. More than 120 MW in production by Oct 2026; Tesla’s target is 400 MW total by year-end 2026 (which implies about 175 MW added in Q4 — a target, not delivered). Tesla’s own use, no external sale. Early ramp from Apr 2026.</li></ul>'+
'<h2>6. Outlook</h2><p>2026 CapEx about $20B (Q3 10-Q), expanding over the next several years. Prior guides: more than $25B (raised in Q1), $20B in January, $8.5B actual in 2025. The 2026 buckets are named — AI training compute and data centres, custom silicon, Terafab, Optimus, robotaxi/Cybercab — but with <b>no</b> dollar figure per bucket. Terafab: tens of billions of dollars of equipment through early 2028, more than $100B long-term total claimed. Backlog (RPO — money customers have committed to pay): no comparable figure found — a gap. Cuts or pauses: the Q3 2026 10-Q cut the 2026 guide from more than $25B to about $20B (−20%) — a real guide cut for 2026, paired with expansion over the next several years (near-term cut, longer-term rise).</p>'+
'<h2>7. Notes, Risks, and Sources</h2><ul><li>Tesla signed $30B of unsecured credit facilities on Sep 29, 2026 but had no loans outstanding under them and said it did not plan to draw in 2026. A credit facility is not debt until it is drawn.</li><li>2026 CapEx guided above $20B vs $14.7B operating cash flow in one summary — flagged as a first net cash-burn year since 2019 on that definition, not yet a reported full-year result. Free cash flow, trailing twelve months to Q3 2026: $3.30B.</li></ul>'+
'<h2>8. Consensus — Latest Full Year</h2><p>2025 — Revenue $94.83B · Free cash flow $6.22B · Cash &amp; short-term investments $44.10B · CapEx $8.53B · R&amp;D $6.41B · Gross margin 18.0%. Share price Nov 5, 2026 close: $343.20.</p>'+
'<h2>9. EBITA</h2><p>Rank #9 of 10. Trailing-twelve-months EBITA <b>$3.47B</b> (operating income $3.47B, operating-income basis; amortization immaterial). Period: Oct 1, 2025 to Sep 30, 2026. EBITA share: 0.4% of the ten-company total.</p>'+
'<h2>10. Latest Balance Sheet (Sep 30, 2026)</h2><p>Total assets $157.5B · Cash $17.9B · Short-term investments $27.6B · Receivables (money owed by customers) $4.6B · Inventory $14.1B · Property, plant and equipment $50.6B · Long-term investments n/a · Other $36.2B.</p>'+
'<h2>11. Assets History</h2><p>Total assets: FY2015 $8.1B · FY2020 $52.1B · FY2025 $137.8B · Q3 2026 $157.5B.</p>'+
'<h2>12. Assets Year-on-Year</h2><p>FY2025 total assets up 12.9% on the year. Growth every year, but decelerating: +52.0% (2020), +19.1% (2021), +32.5% (2022), +29.5% (2023), +14.5% (2024), +12.9% (2025).</p>'+
'<h2>13. Top Shareholders</h2><p>Top 5 holders, shares held, Q3 2026 (Sep 30, 2026) vs 2020 <span class="label proven">PROVEN · SEC 13F; split-adjusted</span>. 1. '+wl('blackrock','BlackRock')+' 214.2M vs 150,241,185. 2. Vanguard Capital Mgmt 184.7M vs 173,442,930. 3. State Street 118.8M vs 88,651,137. 4. Geode 69.9M vs 34,701,705. 5. Invesco 58.0M vs 3,412,809. Note: Vanguard split into two separately filing advisers in Jan 2026; the 2020–2025 figures are the old combined Vanguard Group, the 2026 figure is Vanguard Capital Mgmt only — the apparent drop is not selling. The sheet’s Section 13 shows slightly lower Q2-basis figures (BlackRock 214,123,129; Vanguard 184,023,551; State Street 117,456,756; Geode 68,910,000; Invesco 55,464,442); the Q3 figures above are the newer counts.</p>'+
'<h2>Stakes It Holds</h2><p><b>None.</b> Tesla holds 0 stakes in the notation — 0 joint ventures <span class="label proven">PROVEN</span>. One item sits on the '+wl('watchlist')+': a $1.95B stock acquisition of an unnamed hardware company — the target is not named, so no edge can be written until it is.</p>'+
'<h2>The Test</h2><p>See '+wl('gates','The Tesla Three Gates')+' for the full theory. In short: three gates, each with a bigger expected rise than the last, gated on whether Tesla’s leadership runs the company like a trader (the “Storonsky gate”). Gate 1 — SRAM design, May 2027 (the “NVIDIA escape”: Tesla designs its own memory so it no longer depends on '+wl('nvidia','Nvidia')+'). Gate 2 — Terafab volume, Q3 2028 (Tesla finds a way to make its own SRAM at scale). Gate 3 — Optimus deployment (SRAM in consumer products; first outside-company Optimus deliveries planned end 2027, at volume after Q3 2028). <b>SELL on Optimus release</b> — the one exception to the “just fucking hold” motto, Tesla only. Brenden’s rationale (Nov 17, 2026): once Optimus is shipping to consumers, most of the leg work is already done — the story is realized, so sell despite the hype train on the drop. Assumption <span class="label unv">UNVERIFIED</span>: the memory bottleneck is what is holding Tesla’s price back. Standing watch: if Tesla makes a deal with '+wl('micron')+', flag it early — take the signal before Wall Street prices it in. (A Nov 3 feed claim of a Micron–Tesla allocation deal was corrected Nov 4 — not a live deal.)</p>'+
'<h2>Who’s in Charge</h2><p>Elon Musk, chief executive officer.</p>'+
'<h2>On Camera</h2><p><b>READY</b> (drill 3, Nov 17). In Brenden’s words: once Optimus ships to consumers most of the leg work is done — the story is realized, so sell despite the hype train.</p>' };

P.intel = { title:"Intel", cat:"Companies", tag:"Intel Corporation · INTC · Pig · EBITA rank #10",
infobox: ib("Intel Corporation (INTC)", [["Tranche","Pig"],["EBITA rank","#10 of 10 ($2.66B)"],["Fiscal year","Ends late December (last Saturday)"],["CEO","Lip-Bu Tan"],["Key project","Foundry — making chips for others"],["Camera line","“Tesla proves the foundry works.”"]]),
body:'<p><b>Intel</b> is the old giant of chips, rebuilding itself as a foundry — a company that makes chips designed by others, like '+wl('tsmc','TSMC')+' does. The bet is the 14A process (Intel’s newest chip-making technology): if outside customers trust Intel to make their chips, the foundry works. '+wl('tesla')+' is the first outside customer named for 14A. Intel’s finances are the weakest in the index: free cash flow has been negative four years running, and the spending gap is being funded from outside, not from operations.</p>'+
'<h2>1. At a Glance</h2><p>2026 CapEx guide more than $20B, up more than 11% vs the prior $18B guide, after a flat-to-down start to the year. 2027 spending is up “meaningfully,” with no dollar figure given. Signal: <b>RE-ACCELERATING</b> (from cuts). Financing verdict: cash-burn / externally funded CapEx — the gap is funded from outside, not from operations.</p>'+
'<h2>2. Spending</h2><p>CapEx by year ($B, net property-and-equipment-change series — gross additions are higher, so the combined total is not gross-comparable to peers): 2022 $24.844 · 2023 $25.750 · 2024 $23.944 · 2025 $14.646 · 2026 guide more than $20B. 2025 was 0.59× 2022 — declining, the opposite direction from the rest of the index. R&amp;D by year ($B): 2022 $17.53 · 2023 $16.05 · 2024 $16.55 · 2025 $13.77. R&amp;D as a share of revenue — 27.8% (2022), 29.6% (2023), 31.2% (2024), 26.1% (2025) — is the highest in the index by far; it peaked in 2024 and fell in 2025 on cost cuts. First half of 2026: CapEx $6.192B, R&amp;D $6.743B, combined $12.935B (quarterly gross CapEx: Q1 $4.963B, Q2 $2.652B). Warning: 2026 is partial-year only — do <b>not</b> compare it to full prior years.</p>'+
'<h2>3. Profitability</h2><p>Gross margin (the share of revenue left after the direct cost of making the product): 2022 42.6% · 2023 40.0% · 2024 32.7% · 2025 34.8% · 2026 not reported. Gross profit / revenue ($B): 2022 $26.87 / $63.05 · 2023 $21.71 / $54.23 · 2024 $17.35 / $53.10 · 2025 $18.38 / $52.85. The margin collapsed from 42.6% to 32.7% in FY2024 and recovered only to 34.8% — the anti-AI margin story in the index. (One aggregator lists 2022 gross profit as $27.79B, about 44% — not used; the $26.87B figure comes from the 10-K.)</p>'+
'<h2>4. Financial Position</h2><p>Revenue, free cash flow (cash left after spending), cash and short-term investments, and total debt ($B). Total debt means borrowings plus finance leases, not counting operating leases.</p>'+finTable([["2022","$63.05","−$9.62","$28.34","$42.05"],["2023","$54.23","−$14.28","$25.03","$49.27"],["2024","$53.10","−$15.66","$22.06","$50.01"],["2025","$52.85","−$4.95","$37.42","$46.59"]])+'<p>Net debt by year: 2022 $13.71B · 2023 $24.24B · 2024 $27.95B · 2025 $9.17B. Free cash flow was negative all four years. Operating cash flow fell from $15.43B in 2022 to $9.70B in 2025, while financing cash flow was +$11.59B in 2025 — the gap was funded externally, not by operations.</p>'+
'<h2>5. Operations</h2><ul><li><b>Intel Ohio One, Fab 1/2</b>, New Albany, Ohio — BEING BUILT. $28–30B reported; $5B spent in total by May 2026 in one report. First major truss installed Oct 21, 2026. Fab 1 construction finishes 2030, production 2030–31; Fab 2 finishes 2031, production 2032. The original 2025 production target has slipped about five years. No major outside customer announced. Power (MW) n/r.</li><li><b>Intel Fab 62</b>, Chandler, Arizona — BEING BUILT. 14A process / High-NA EUV (the newest chip-printing machines). Tool move-in began Oct 2026; high-volume manufacturing from 2028 reported. MW n/r. Fab 62 is part of the SCIP joint venture with '+wl('brookfield')+' (Intel 51%, Brookfield 49%).</li></ul>'+
'<h2>6. Outlook</h2><p>2026 CapEx more than $20B; 2027 up meaningfully, no dollar figure. Prior 2026 guide was $18B; before that, flat-to-down. The change is more than +$2B vs the $18B base, and the direction has reversed from flat-to-down. No AI / data-center split is disclosed. Data Center and AI revenue was $6.3B in Q2 2026, up 59% year-on-year (context only, not spend). Backlog (RPO — money customers have committed to pay): no comparable figure found — a gap. Cuts or pauses: no 2026 CapEx cut. Prior era: the 2024–25 cost programme (operating-expense targets of $17B in 2025 / $16B in 2026, a headcount cut of more than 15%, CapEx down 20% in the 2024 plan) is historical context, not the current guide.</p>'+
'<h2>7. Notes, Risks, and Sources</h2><ul><li>Operating cash flow fell from $15.43B (2022) to $9.70B (2025) while financing cash flow was +$11.59B in 2025 — the gap was funded externally, not by operations.</li><li>Definition conflict: a separate 2025 summary gives adjusted free cash flow of −$1.6B for 2025 vs the −$4.95B GAAP (standard accounting) figure above, after about $1.6B of government grants and partner contributions.</li><li>Gross margin collapsed from 42.6% to 32.7% (FY2024), recovering only to 34.8% — the anti-AI margin story in the index.</li></ul>'+
'<h2>8. Consensus — Latest Full Year</h2><p>2025 — Revenue $52.85B · Free cash flow −$4.95B · Cash &amp; short-term investments $37.42B · CapEx $14.65B · R&amp;D $13.77B · Gross margin 34.8%. Share price Nov 5, 2026 close: $52.25.</p>'+
'<h2>9. EBITA</h2><p>Rank #10 of 10. Trailing-twelve-months EBITA <b>$2.66B</b> (operating income $1.76B + amortization $0.90B, from Intel’s own cash-flow line). Period: Sep 27, 2025 to Sep 26, 2026. EBITA share: 0.3% of the ten-company total.</p>'+
'<h2>10. Latest Balance Sheet (Sep 26, 2026)</h2><p>Total assets $228.6B · Cash $21.8B · Short-term investments $32.2B · Receivables (money owed by customers) $4.1B · Inventory $13.1B · Property, plant and equipment $105.3B · Long-term investments $8.8B · Other $20.4B.</p>'+
'<h2>11. Assets History</h2><p>Total assets: FY2015 $101.5B · FY2020 $153.1B · FY2025 $211.4B · Q3 2026 $228.6B.</p>'+
'<h2>12. Assets Year-on-Year</h2><p>FY2025 total assets up 7.6% on the year. Steady single-digit growth — +8.1% (2022), +5.2% (2023), +2.6% (2024), +7.6% (2025); the slowest growth in the index alongside the telecoms.</p>'+
'<h2>13. Top Shareholders</h2><p>Top 5 holders, shares held, Q3 2026 (Sep 30, 2026) vs 2020 <span class="label proven">PROVEN · SEC 13F</span>. 1. '+wl('blackrock','BlackRock')+' 460.5M vs 309,411,663 — added 34.0M shares in Q3 (+7.98%). 2. Vanguard Capital Mgmt 309.3M vs 339,140,220 — added 24.1M shares in Q3 (+8.44%). 3. State Street 223.3M vs 177,408,741. 4. '+wl('nvidia')+' 161.1M vs no position in 2020 (the stake closed Dec 2025) — Nvidia <b>cut</b> its Intel stake in Q3 2026 from 214,776,632 shares to 161,082,488, down 25%, before Intel’s slide (Intel closed Sep 30 at $120.23 and was $59.66 by Nov 13). The sheet’s Section 13 still shows the Q2 figure of 214,776,632; the Q3 figure of 161,082,488 is the current count. 5. Invesco 169.8M vs 14,068,978. Note: Vanguard split into two separately filing advisers in Jan 2026; the 2020–2025 figures are the old combined Vanguard Group, the 2026 figure is Vanguard Capital Mgmt only — the apparent drop is not selling. The big index funds all added Intel in Q3, consistent with the new shares Intel issued in its Aug 2026 equity offering. Two holders sit outside the top-5 13F list but matter: the U.S. Government holds about 433,323,000 shares direct (about 8–9.9%) plus a 5-year warrant for 240,516,150 shares at $20, exercisable only if Intel stops owning at least 51% of its foundry business <span class="label proven">PROVEN · Intel 8-K, Aug 2025</span>; '+wl('softbank','SoftBank')+' holds 86,956,522 shares, $12.14B <span class="label reported">REPORTED · Q2 2026 13F</span>, hedged with prepaid forward collars in Aug 2026 — the shares are still held, but the economic exposure is capped and floored.</p>'+
'<h2>Stakes It Holds</h2><p>Intel holds stakes in <b>6 partners</b> (cash out — it spent to buy in): '+wl('figure','Figure AI')+' via Intel Capital (Intel’s investment arm) — Series A extension + B + C <span class="label reported">REPORTED</span>, amounts n/r; the majority of IMS Nanofabrication <span class="label proven">PROVEN</span> — '+wl('tsmc','TSMC')+' holds about 10%; 76% of Mobileye (the 13F portion is 50,000,000 Class A shares, $369.5M) <span class="label proven">PROVEN</span>; Joby Aviation, 15,316,315 shares, $92.7M (Q3 13F) <span class="label proven">PROVEN</span>; IREN, 1,290,365 shares, $52.8M, added in Q3 2026 (Q3 13F) <span class="label proven">PROVEN</span>; 51% of the Arizona SCIP joint venture ('+wl('brookfield')+' 49%) — Fab 52 operating, Fab 62 building <span class="label proven">PROVEN</span>. Historical note: Apollo is gone — Intel repurchased Apollo’s 49% of Ireland Fab 34 on Apr 8, 2026 for $14.2B; Fab 34 is now 100% Intel.</p>'+
'<h2>The Test</h2><p>Intel has no company-specific sell test in this project. The signal to watch is the foundry: '+wl('tesla')+' is the first outside customer named for Intel’s 14A process — it proves the foundry bet works, even though the revenue comes later. The signal now is validation, not sales. Two more facts from the drill work: in Q3 2026, Intel’s data-center operating profit passed its PC operating profit — the server business is now earning more than the PC business — and CEO Lip-Bu Tan has made Xeon server-chip supply the priority over PC chips.</p>'+
'<h2>Who’s in Charge</h2><p>Lip-Bu Tan, chief executive officer.</p>'+
'<h2>On Camera</h2><p><b>READY</b> (drill 8, Nov 18). Camera line: “Tesla proves the foundry works.”</p>' };
</script>
<script>
P.berkshire = { title:"Berkshire Hathaway", cat:"Partners", tag:"Partner ledger · built Nov 12, 2026",
infobox: ib("Berkshire Hathaway Inc. (BRK.A / BRK.B)", [["Type","Partner ledger, built Nov 12, 2026"],["Links to the ten", wl('apple','Apple')+" · "+wl('alphabet','Alphabet')]]),
body:'<p><b>Berkshire Hathaway</b> is the investment company led by Warren Buffett. It qualifies for its own partner ledger because it is publicly traded and holds shares in two of the ten.</p><h2>What it holds in the ten</h2><ul><li>'+wl('apple')+': 227,917,808 shares, $66.0B — Berkshire’s #1 holding <span class="label reported">REPORTED · Q2 2026 13F; Q3 not yet re-checked</span>. In the notation: <span class="notation">AAPL(BRK)</span>.</li><li>'+wl('alphabet')+': 78,791,167 Class A shares + 27,188,433 Class C shares = 106.0M shares, about $37.8B, including a $10B private placement in Jun 2026 <span class="label reported">REPORTED · Q2 2026 13F; Q3 not yet re-checked</span>. In the notation: <span class="notation">GOOGL(BRK)</span>.</li></ul><h2>Bridge</h2><p>Berkshire connects Apple and Alphabet: <span class="notation">AAPL(BRK)GOOGL</span>. It is the only partner that holds both.</p>' };
P.softbank = { title:"SoftBank", cat:"Partners", tag:"Partner ledger · built Nov 12, 2026",
infobox: ib("SoftBank Group Corp. (TSE: 9984)", [["Type","Partner ledger, built Nov 12, 2026"],["Links to the ten", wl('intel','Intel')+" · "+wl('tsmc','TSMC')]]),
body:'<p><b>SoftBank</b> is a Japanese investment group. It qualifies for its own partner ledger because it is publicly traded and holds shares in two of the ten.</p><h2>What it holds in the ten</h2><ul><li>'+wl('intel')+': 86,956,522 shares, $12.14B <span class="label reported">REPORTED · Q2 2026 13F; Q3 not yet re-checked</span>. In the notation: <span class="notation">INTC(SB)</span>. In Aug 2026 SoftBank hedged the whole stake with prepaid forward collars — a financial contract that caps how much the shares can gain or lose — raising about $7.4B. The shares are still held; the economic exposure is capped and floored <span class="label reported">REPORTED</span>.</li><li>'+wl('tsmc','TSMC')+': 565,000 ADRs (American depositary receipts — US-traded certificates for foreign shares), $269.8M, trimmed in Q2 2026 <span class="label reported">REPORTED · Q2 2026 13F; Q3 not yet re-checked</span>. In the notation: <span class="notation">TSM(SB)</span>.</li></ul><h2>Bridge</h2><p>SoftBank connects Intel and TSMC: <span class="notation">INTC(SB)TSM</span> (the Intel leg is hedged).</p>' };
P.brookfield = { title:"Brookfield", cat:"Partners", tag:"Partner ledger · built Nov 12, 2026",
infobox: ib("Brookfield Asset Management Ltd. (NYSE: BAM)", [["Type","Partner ledger, built Nov 12, 2026"],["Links to the ten", wl('intel','Intel')+" · "+wl('nvidia','Nvidia')]]),
body:'<p><b>Brookfield</b> is a large asset manager (a company that invests money for clients, including in infrastructure like data centers and chip fabs). It qualifies for its own partner ledger because it is publicly traded and shares ownership with two of the ten.</p><h2>What it holds in the ten</h2><ul><li>'+wl('intel')+': 49% of the Arizona SCIP joint venture (Intel 51%). The venture owns two Intel fabs in Chandler, Arizona: Fab 52 is operating, Fab 62 is building <span class="label proven">PROVEN</span>.</li><li>'+wl('nvidia')+': the Brookfield AI Infrastructure Fund (BAIIF), where Nvidia is an anchor investor; $2B <span class="label reported">REPORTED</span> (single-source, unconfirmed); fund existence <span class="label proven">PROVEN</span>.</li></ul><h2>Bridge</h2><p>Brookfield connects Intel and Nvidia: <span class="notation">INTC(BAM)NVDA</span> — the SCIP venture with Intel plus the AI fund with Nvidia.</p>' };
P.blackrock = { title:"BlackRock", cat:"Partners", tag:"Largest holder of the ten · holds all ten companies",
infobox: ib("BlackRock, Inc. (BLK)", [["Role","Largest holder of the ten"],["Holds","All ten companies"]]),
body:'<p><b>BlackRock</b> is the world’s largest asset manager — a company that invests money for clients, mostly through index funds (funds that automatically buy a little bit of every company in an index). It is the biggest single holder in the Monkey Pig web.</p><h2>What it holds in the ten</h2><p>Q3 2026, Sep 30, 2026 — <span class="label proven">PROVEN · SEC 13F tables</span>. BlackRock holds 100M+ shares in 9 of the 10, and is the #1 holder of every company except where noted:</p><ul><li>'+wl('nvidia')+' 1,940.9M</li><li>'+wl('tsmc','TSMC')+' 19.5M ADRs</li><li>'+wl('alphabet')+' 459.0M Class A</li><li>'+wl('microsoft')+' 607.1M</li><li>'+wl('micron')+' 104.8M</li><li>'+wl('apple')+' 1,157.1M</li><li>'+wl('intel')+' 460.5M</li><li>'+wl('tesla')+' 214.2M</li><li>'+wl('verizon')+' 404.6M</li><li>'+wl('att','AT&T')+' 548.7M</li></ul><p>In Q3 2026 BlackRock added 34.0M Intel shares (+7.98%) as Intel issued new shares in Aug 2026.</p><h2>Bridge</h2><p>BlackRock holds all ten, so it bridges all 45 pairs — every possible pairing of two index companies runs through BlackRock. (That is a fact about index funds, not a sign BlackRock is making active bets: index funds hold what the index holds.)</p><h2>Note</h2><p>BlackRock does not have a full partner ledger in this project. Its role in the web is as a holder, recorded in each company’s Top Shareholders section and in the bridges. It also co-owns the Gigapower fiber venture with '+wl('att','AT&T')+' through GIP (Global Infrastructure Partners), and co-founded the AI Infrastructure Partnership (AIP) — AIP’s status as an edge is borderline and awaits Brenden’s ruling.</p>' };
P.ast = { title:"AST SpaceMobile", cat:"Shared assets", tag:"Shared asset · held by AT&T, Verizon, Alphabet",
infobox: ib("AST SpaceMobile, Inc. (NASDAQ: ASTS)", [["Type","Shared asset"],["Held by", wl('att','AT&T')+" · "+wl('verizon','Verizon')+" · "+wl('alphabet','Alphabet')]]),
body:'<p><b>AST SpaceMobile</b> is building a network of satellites that connect directly to ordinary phones. Three of the ten hold its shares in parallel — each holds its own shares; this is <b>not</b> a joint venture.</p><h2>The three legs</h2><p><span class="label proven">PROVEN</span></p><ul><li>'+wl('att','AT&T')+': a $35.0M subordinated convertible note (a loan that converts into shares) bought Jan 16, 2024, converted Feb 3, 2025 into 6,260,440 Class A shares (about 2.8% of Class A). AT&amp;T’s Chris Sambar (EVP, Head of Network) joined AST’s board <span class="label reported">REPORTED</span>.</li><li>'+wl('verizon')+': $35M in convertible notes bought May 2024 (part of a $100M Verizon commitment: $65M commercial prepayments + $35M notes), converted Jan/Feb 2025 when AST forced conversion of all 2024 notes. Share count n/r.</li><li>'+wl('alphabet')+': 8,943,486 shares, $526,413,586 at Sep 30, 2026 <span class="label proven">PROVEN · Q3 13F</span>.</li></ul><h2>How it happened</h2><p>Jan 18, 2024: AST announced $110M of 10-year convertible notes from AT&amp;T, Google, and Vodafone. May 2024: Verizon added $35M in notes. Jan 22, 2025: AST forced conversion of all 2024 notes (about $148.5M of principal plus interest, turning into 25,818,541 shares). The commercial prepayments ($65M from Verizon, $20M AT&amp;T and $25M Vodafone revenue commitments) are commercial deals, <b>not</b> ownership — they don’t count as edges.</p><h2>Why it matters</h2><p>AST SpaceMobile is '+wl('att','AT&T')+'’s satellite partner and one of '+wl('verizon')+'’s, so it sits right next to the '+wl('satellite','Satellite Joint Venture')+' story. It bridges three pairs: T–VZ, T–GOOGL, VZ–GOOGL. It qualifies for its own partner ledger (publicly traded + 2+ M&amp;P links) but Brenden has not ruled on building one.</p>' };
P.marvell = { title:"Marvell", cat:"Shared assets", tag:"Shared asset · held by Nvidia, Alphabet · noted Nov 20, 2026",
infobox: ib("Marvell Technology, Inc. (NASDAQ: MRVL)", [["Type","Shared asset"],["Held by", wl('nvidia','Nvidia')+" · "+wl('alphabet','Alphabet')],["Note","Noted Nov 20, 2026 — not stressed about, no ledger built"]]),
body:'<p><b>Marvell</b> makes chips and networking parts for data centers. '+wl('nvidia')+' and '+wl('alphabet')+' both hold equity-linked stakes in it in parallel — <b>not</b> a joint venture.</p><h2>The two legs</h2><p><span class="label proven">PROVEN</span></p><ul><li>'+wl('nvidia')+': $2.0B cash for 2,000,000 shares of Series A Convertible Preferred stock (Mar 31, 2026), convertible into up to 21,778,000 common shares <span class="label proven">PROVEN · Marvell 8-K + Q2 FY2027 10-Q</span>.</li><li>'+wl('alphabet')+': a warrant (the right to buy shares at a set price) issued Aug 18, 2026 to Google LLC for up to 58,970,907 common shares at $206.58 per share, exercisable until Aug 18, 2033; Google paid nothing for the warrant <span class="label proven">PROVEN · Marvell 8-K Aug 19, 2026</span>. Alphabet’s own Q3 10-Q does not mention Marvell — the warrant is disclosed only in Marvell’s filing.</li></ul><h2>The Lumentum deal</h2><p>Marvell agreed Nov 2, 2026 to acquire Lumentum in a $115B all-stock deal (close expected H1 2028) <span class="label reported">REPORTED</span>. '+wl('nvidia','Nvidia')+' also holds $2B of Lumentum convertible preferred — after the close, Nvidia’s Marvell and Lumentum positions consolidate into one Marvell exposure. Noted Nov 20, 2026: Marvell is a shared exposure — if Marvell stumbles, two of the ten feel it through the same channel. Brenden: noted, not stressed about it. No ledger built.</p>' };

body:'<p><b>Figure AI</b> is a private humanoid-robotics company (it builds human-shaped robots). '+wl('microsoft')+', '+wl('nvidia')+', and Intel Capital (Intel’s investment arm) all hold equity in it in parallel — <b>not</b> a joint venture. '+wl('brookfield')+' and T-Mobile are also reported in the cluster <span class="label reported">REPORTED</span>.</p><h2>The legs</h2><p><span class="label reported">REPORTED</span>; amounts and % n/r.</p><ul><li>'+wl('microsoft')+': Series B.</li><li>'+wl('nvidia')+': Series B + C.</li><li>'+wl('intel')+' (Intel Capital): Series A extension + B + C.</li></ul><h2>Bridge</h2><p>Figure AI connects three pairs: MSFT–NVDA, MSFT–INTC, NVDA–INTC.</p>' };
P.watchlist = { title:"Watchlist", cat:"More", tag:"Things that can’t be written as edges yet",
body:'<p>Things that can’t be written as edges yet, under the standing rule: no edge until b is named or the entity exists (decided Nov 20, 2026). They stay here until they qualify. See '+wl('notation','The Notation')+'.</p><ul>'+
'<li><b>Gui’an ('+wl('apple','Apple')+'):</b> Apple funded and co-built the Gui’an iCloud data center in China with GCBD (a Guizhou state-owned company); Apple put in about $1B <span class="label reported">REPORTED</span>. GCBD operates the facility. No joint-venture entity exists, ownership % n/r, direction unclear. Not an edge.</li>'+
'<li><b>Alphabet’s $20B derivative:</b> a $20.0B equity derivative (a financial contract tied to shares) with forward funding commitments. The counterparty is <b>unnamed</b> in Alphabet’s 10-Q. Existence <span class="label proven">PROVEN</span>; a <span class="label reported">REPORTED</span> identification as '+wl('anthropic','Anthropic')+'-linked is unreconciled — do not merge it with <span class="notation">GOOGL(-ANT)</span>. Not an edge until the counterparty is named.</li>'+
'<li><b>Tesla’s $1.95B buy:</b> '+wl('tesla')+' bought $1.95B of stock in an unnamed “SI hardware company.” The target is n/r. Cannot be expressed until the target is named.</li>'+
'<li><b>Microsoft–LSEG:</b> '+wl('microsoft')+' bought about 4% of LSEG (London Stock Exchange Group) in Dec 2022 <span class="label proven">PROVEN purchase</span>. Current holding n/r — needs a re-check before it counts as a live edge.</li>'+
'<li><b>Verizon–Yahoo:</b> a reported 10% '+wl('verizon')+' stake in Yahoo Inc. has not been verified in this sweep; needs a filings check.</li>'+
'<li><b>Pending, not live:</b> '+wl('att','AT&T')+'’s combined fiber JV with GIP + CPP (announced Oct 6, 2026, closing H1 2027, absorbs Gigapower); '+wl('micron')+'’s up-to-$500M GlobalWafers convertible bonds (board-approved, needs a shareholder vote); '+wl('tsmc','TSMC')+'’s board-approved ceiling of up to $500M for '+wl('openai','OpenAI')+' preferred stock (purchase n/r); '+wl('nvidia')+'–Meta $3B equity (announced Oct 26, 2026, non-binding, close unconfirmed).</li></ul>' };
P.sources = { title:"Sources and Labels", cat:"More", tag:"What PROVEN, REPORTED, and n/r mean · cutoffs and dates",
body:'<h2>Labels</h2><ul><li><span class="label proven">PROVEN</span> — read in a filing (10-K, 10-Q, 8-K, 13F) or a company announcement.</li><li><span class="label reported">REPORTED</span> — a reputable secondary source (major newspaper, wire, or trade publication), not the filing itself.</li><li><span class="label nr">n/r</span> — not retrieved. The value was not found in the sources read. It is a gap, not a zero, and never invented.</li><li><span class="label unv">UNVERIFIED</span> — a claim that has not been checked. Labeled, never presented as settled.</li><li><b>~</b> — a rounded source figure.</li></ul>'+
'<h2>Cutoffs and dates</h2><ul><li>Spreadsheet figures: cutoff Oct 28, 2026, plus Nov 3–6, 2026 filing updates.</li><li>Shareholder counts: Q3 2026 (Sep 30, 2026) from SEC EDGAR 13F tables, unless a page says Q2 2026 (Jun 30, 2026).</li><li>Edge records: Nov 12–20, 2026. Notation rulings: Nov 19–20, 2026.</li><li>'+wl('anthropic','Anthropic')+' facts: through Nov 21, 2026.</li><li>Fiscal years differ by company — do not compare a fiscal year to a calendar year without that note. '+wl('nvidia','Nvidia')+'’s year ends late January; '+wl('microsoft','Microsoft')+'’s June 30; '+wl('apple','Apple')+'’s late September; '+wl('micron','Micron')+'’s late August/early September; '+wl('alphabet','Alphabet')+', '+wl('intel','Intel')+', '+wl('tesla','Tesla')+', '+wl('verizon','Verizon')+', '+wl('att','AT&T')+', and '+wl('tsmc','TSMC')+' use Dec 31. TSMC reports in NT$ under IFRS; its dollar figures are converted or analyst-reported.</li></ul>'+
'<h2>What this wiki does not do</h2><ul><li>It does not cover companies outside the ten, except as partners or shared assets linked to the ten.</li><li>It does not predict unannounced deals.</li><li>It is not trading advice. Brenden does not trade stocks.</li></ul>' };

var sidebar = document.getElementById('sidebar');

ORDER.forEach(function(g){ sbHtml += '<h4>'+g[0]+'</h4>'; g[1].forEach(function(it){ sbHtml += '<a href="#/'+it[0]+'" data-page="'+it[0]+'" data-nav="'+it[0]+'">'+it[1]+(it[2]?' <span class="tk">'+it[2]+'</span>':'')+'</a>'; }); });

function currentId(){ var h = location.hash.replace(/^#\/?/,''); return P[h] ? h : 'home'; }
function render(){
  var id = currentId(); var pg = P[id];
  document.title = pg.title + ' — Monkey Pig Wiki';
  var html = '<h1 class="article">'+pg.title+'</h1><div class="tagline">'+(pg.tag||'')+'</div>';
  if(pg.infobox) html += pg.infobox;
  html += pg.body;
  html += '<div class="foot">Monkey Pig Wiki · Figures carry their labels — PROVEN (filing), REPORTED (secondary source), n/r (not retrieved). See <a href="#/sources" data-page="sources">Sources and Labels</a> for cutoffs. Not trading advice.</div>';
  var el = document.getElementById('article'); el.innerHTML = html;
  // Build TOC from h2s
  var heads = el.querySelectorAll('h2');
  if(heads.length > 2){
    var toc = document.createElement('div'); toc.className='toc';
    var ol = '<div class="toc-t">Contents</div><ol>';
    heads.forEach(function(h,i){ h.id = 'sec'+i; ol += '<li><a href="#'+id+'" data-anchor="sec'+i+'">'+h.textContent+'</a></li>'; });
    toc.innerHTML = ol + '</ol>';
    var firstP = el.querySelector('p');
    if(firstP && firstP.nextSibling) el.insertBefore(toc, firstP.nextSibling); else el.appendChild(toc);
  }
  document.querySelectorAll('[data-nav]').forEach(function(a){ a.classList.toggle('active', a.getAttribute('data-nav')===id); });
  sidebar.classList.remove('open');
  window.scrollTo(0,0);
}
document.addEventListener('click', function(e){
  var a = e.target.closest('[data-page]');

  var t = e.target.closest('[data-anchor]');
  if(t){ e.preventDefault(); var s = document.getElementById(t.getAttribute('data-anchor')); if(s) s.scrollIntoView({behavior:'smooth'}); }
});

function plainText(html){ var d=document.createElement('div'); d.innerHTML=html; return d.textContent; }
searchInput.addEventListener('input', function(){

<script>
/* ===== Chart engine + panels ===== */
var PAL = ["#3366cc","#14866d","#c07a12","#795cb2","#b32424","#2a7f9e","#6b7c2a","#a34a7f","#54595d","#8a5a2b"];
var VS = {};
function fmtV(v, unit){
  if(v === null || v === undefined) return "n/r";
  var s;
  if(unit === "%") s = (Math.round(v*10)/10) + "%";
  else if(unit === "MW") s = v + " MW";
  else if(unit === "GW") s = v + " GW";
  else if(unit === "M") s = v + "M";
  else if(unit === "$") s = "$" + v;
  else if(unit === " links") s = v + " links";
  else if(unit === "shares") s = v + "";
  else s = "$" + v + "B";
  return s;
}
function svgOpen(w,h,label){ return '<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+label.replace(/"/g,"&quot;")+'">'; }
function hBars(items, unit, colors){
  var max = 0; items.forEach(function(it){ if(it[1] > max) max = it[1]; });
  if(max <= 0) max = 1;
  var rowH = 30, H = items.length * rowH + 8, W = 640;
  var s = svgOpen(W,H,"Bar chart: " + items.map(function(it){ return it[0]+" "+fmtV(it[1],unit); }).join(", "));
  s += '<g font-size="12.5" fill="currentColor">';
  items.forEach(function(it,i){
    var y = 6 + i*rowH, w = Math.max(3, it[1]/max*330);
    var c = colors ? colors[i % colors.length] : PAL[i % PAL.length];
    s += '<text x="0" y="'+(y+14)+'">'+it[0]+'</text>';
    s += '<rect x="215" y="'+y+'" width="'+w+'" height="17" fill="'+c+'"></rect>';
    s += '<text x="'+(222+w)+'" y="'+(y+14)+'" font-weight="600">'+fmtV(it[1],unit)+'</text>';
  });
  return s + '</g></svg>';
}
function vBars(labels, values, unit, baseline){
  var W = 640, H = 262, top = 30, bot = 34, plotH = H - top - bot;
  var max = 0, min = 0;
  values.forEach(function(v){ if(v !== null && v !== undefined){ if(v > max) max = v; if(v < min) min = v; } });
  if(baseline !== undefined && baseline !== null){ if(baseline > max) max = baseline; if(baseline < min) min = baseline; }
  if(max === min) max = min + 1;
  var range = max - min, y0 = top + (max/range)*plotH;
  function Y(v){ return top + ((max - v)/range)*plotH; }
  var n = labels.length, slot = (W - 30)/n, bw = Math.min(64, slot*0.58);
  var s = svgOpen(W,H,"Bar chart: " + labels.map(function(l,i){ return l+" "+fmtV(values[i],unit); }).join(", "));
  s += '<g font-size="12" fill="currentColor">';
  s += '<line x1="8" y1="'+y0+'" x2="'+(W-6)+'" y2="'+y0+'" stroke="currentColor" stroke-width="1" opacity="0.55"></line>';
  if(baseline !== undefined && baseline !== null){
    s += '<line x1="8" y1="'+Y(baseline)+'" x2="'+(W-6)+'" y2="'+Y(baseline)+'" stroke="#b32424" stroke-width="1.5" stroke-dasharray="6 4"></line>';
    s += '<text x="'+(W-8)+'" y="'+(Y(baseline)-6)+'" text-anchor="end" fill="#b32424" font-size="11.5">paid '+fmtV(baseline,unit)+'</text>';
  }
  values.forEach(function(v,i){
    if(v === null || v === undefined){
      s += '<text x="'+(15 + i*slot + slot/2)+'" y="'+(H-12)+'" text-anchor="middle">'+labels[i]+'</text>';
      s += '<text x="'+(15 + i*slot + slot/2)+'" y="'+(y0-8)+'" text-anchor="middle" fill="currentColor" opacity="0.6">n/r</text>';
      return;
    }
    var x = 15 + i*slot + (slot-bw)/2, y = Y(v);
    var yTop = Math.min(y, y0), hh = Math.max(2, Math.abs(y0 - y));
    s += '<rect x="'+x+'" y="'+yTop+'" width="'+bw+'" height="'+hh+'" fill="'+PAL[i % PAL.length]+'"></rect>';
    s += '<text x="'+(x+bw/2)+'" y="'+(v >= 0 ? y-6 : y+15)+'" text-anchor="middle" font-weight="600">'+fmtV(v,unit)+'</text>';
    s += '<text x="'+(15 + i*slot + slot/2)+'" y="'+(H-12)+'" text-anchor="middle">'+labels[i]+'</text>';
  });
  return s + '</g></svg>';
}
function lineChart(labels, values, unit, baseline){
  var W = 640, H = 262, top = 30, bot = 34, plotH = H - top - bot, L = 34, R = W - 16;
  var max = -1e18, min = 1e18;
  values.forEach(function(v){ if(v !== null && v !== undefined){ if(v > max) max = v; if(v < min) min = v; } });
  if(baseline !== undefined && baseline !== null){ if(baseline > max) max = baseline; if(baseline < min) min = baseline; }
  if(min > 0) min = Math.max(0, min - (max-min)*0.18);
  if(max === min) max = min + 1;
  var pad = (max-min)*0.12; max += pad; min -= pad;
  function X(i){ return labels.length === 1 ? (L+R)/2 : L + i*((R-L)/(labels.length-1)); }
  function Y(v){ return top + ((max - v)/(max-min))*plotH; }
  var s = svgOpen(W,H,"Line chart: " + labels.map(function(l,i){ return l+" "+fmtV(values[i],unit); }).join(", "));
  s += '<g font-size="12" fill="currentColor">';
  if(min < 0) s += '<line x1="'+L+'" y1="'+Y(0)+'" x2="'+R+'" y2="'+Y(0)+'" stroke="currentColor" stroke-width="1" opacity="0.5"></line>';
  if(baseline !== undefined && baseline !== null){

function pieChart(items, unit){

    var on = document.body.classList.toggle('charts-only');
    numBtn.textContent = on ? 'Tables: Off' : 'Tables: On';
    numBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
}
window.addEventListener('hashchange', function(){ setTimeout(enhance, 0); });
document.addEventListener('click', function(e){ if(e.target.closest('[data-page]')) setTimeout(enhance, 0); });
enhance();
</script>
</body>
