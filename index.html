<script>
var TITLES = {home:"Monkey Pig Index",nvidia:"Nvidia",microsoft:"Microsoft",apple:"Apple",alphabet:"Alphabet",micron:"Micron",tsmc:"TSMC",verizon:"Verizon",att:"AT&T",tesla:"Tesla",intel:"Intel",brendentest:"The Brenden Test",notation:"The Notation",anthropic:"Anthropic",satellite:"Satellite Joint Venture",memory:"The Memory Shortage",gates:"The Tesla Three Gates",berkshire:"Berkshire Hathaway",softbank:"SoftBank",brookfield:"Brookfield",blackrock:"BlackRock",ast:"AST SpaceMobile",marvell:"Marvell",openai:"OpenAI",mistral:"Mistral AI",verily:"Verily",figure:"Figure AI",watchlist:"Watchlist",sources:"Sources and Labels"};
function wl(id,label){ return '<a href="#/'+id+'" data-page="'+id+'">'+(label||TITLES[id]||id)+'</a>'; }
var P = {};
P.home = { title:"Monkey Pig Index", cat:"Home", tag:"From the wiki's main page · An invented index of ten companies, tracked in plain English",
body:
'<p>The <b>Monkey Pig Index</b> is an invented index of ten companies, built by Brenden Renn for a weekly YouTube news video (@brendenrenn). The ten are the companies building artificial intelligence (AI) and the data centers that run it — the chips, the memory, the cloud software, and the phone networks.</p>'+
'<p>Brenden does not trade stocks. The index is a way to learn how the AI buildout works, to present it plainly, and — most important — to spot trouble early and avoid big market slides like the one on Oct 29–30, 2026.</p>'+
'<p>The ten are split into two groups of five. The <b>Monkeys</b> are '+wl('apple')+', '+wl('micron')+', '+wl('nvidia')+', '+wl('alphabet')+', and '+wl('tsmc')+'. The <b>Pigs</b> are '+wl('intel')+', '+wl('tesla')+', '+wl('microsoft')+', '+wl('verizon')+', and '+wl('att','AT&T')+'. The split is a running joke with a real point: the Monkeys mostly make or sell the stuff AI runs on, and the Pigs are a mixed bag of builders, buyers, and carriers.</p>'+
'<h2>The index at a glance</h2><ul>'+
'<li>Ten companies, ranked by EBITA — earnings before interest, tax, and amortization, roughly the profit from day-to-day operations. Combined trailing EBITA is about <b>$939 billion</b>. '+wl('nvidia')+' is #1 at $198.29B; '+wl('intel')+' is #10 at $2.66B.</li>'+
'<li>Combined total assets: <b>$4,266.2B</b> at the latest count (2026), up from $1,450.6B in 2015 and $2,161.6B in 2020. Combined revenue (latest full year): $2,096.58B. Combined free cash flow (cash left after spending): $504.21B. Combined cash and short-term investments: $696.00B. Combined CapEx (spending on buildings and equipment): $345.12B. Combined R&amp;D (research and development): $195.45B. <i>These combined figures mix fiscal years — the companies end their years on different dates — so they are not a single calendar-year total.</i></li>'+
'<li>The US data-center pipeline (verified, Oct 2026): <b>102 active US projects, 99.1 GW of capacity planned, 50.5 GW under construction</b>. Texas alone: 27.5 GW planned, 14.2 GW under construction across 28 projects. The buildout phase is mixed — construction plus energization/commissioning — and turning the power on at full scale is the bottleneck where projects slip 12–24 months.</li>'+
'<li>Who actually inflected on CapEx (spending jumped): '+wl('alphabet')+', '+wl('microsoft')+', '+wl('micron')+', '+wl('tsmc')+' (guidance), '+wl('tesla')+' (guidance) — a real supercycle. '+wl('apple')+', '+wl('intel')+', '+wl('verizon')+', and '+wl('att','AT&T')+' are flat to down, with no AI CapEx jump. '+wl('nvidia')+'’s own CapEx is small — its revenue <i>is</i> the supercycle (seller, not builder).</li>'+
'<li>The one question behind the whole index: '+wl('brendentest','The Brenden Test')+' — “Does the spending earn its money back?”</li>'+
'<li>The ownership web: <b>123 recorded links</b> between the ten and their partners, written in '+wl('notation','The Notation')+' — a company in brackets means someone owns a piece of it, a minus sign means the company spent money to buy in.</li></ul>'+
'<h2>EBITA ranking — the ten compared</h2>'+
'<svg viewBox="0 0 640 300" width="100%" role="img" aria-label="Bar chart of trailing EBITA for the ten companies, Nvidia highest at 198 billion dollars, Intel lowest at 2.7 billion" style="max-width:640px;display:block;margin:.6rem 0"><g font-size="12" fill="currentColor">'+
[['Nvidia',198.29],['Microsoft',167.39],['Apple',162.96],['Alphabet',157.90],['Micron',99.34],['TSMC',90.73],['Verizon',32.45],['AT&T',23.81],['Tesla',3.47],['Intel',2.66]].map(function(r,i){var w=Math.max(4,r[1]/198.29*400);var y=8+i*29;return '<text x="0" y="'+(y+13)+'" width="80">'+r[0]+'</text><rect x="86" y="'+y+'" width="'+w+'" height="17" fill="#3366cc" opacity="'+(i<5?0.9:0.55)+'"></rect><text x="'+(92+w)+'" y="'+(y+13)+'">$'+r[1].toFixed(2)+'B</text>';}).join('')+
'</g></svg><p class="small">Trailing-twelve-months EBITA, per-company periods as listed on each company page. Combined total ≈ $939B.</p>'+
'<h2>The ten companies</h2>'+
'<table class="data"><tr><th>Rank (EBITA)</th><th>Company</th><th>Tranche</th><th>Key project</th><th>Who’s in charge</th></tr>'+
[['#1','nvidia','Nvidia','Monkey','Vera Rubin chips','Colette Kress, interim CEO'],['#2','microsoft','Microsoft','Pig','Maia chip and Copilot','Satya Nadella, CEO'],['#3','apple','Apple','Monkey','iPhone 20','John Ternus, CEO'],['#4','alphabet','Alphabet','Monkey','Tensor chip and AI models','Sundar Pichai, CEO'],['#5','micron','Micron','Monkey','HBM4 memory','Sanjay Mehrotra, CEO'],['#6','tsmc','TSMC','Monkey','Fab buildouts','C.C. Wei, CEO'],['#7','verizon','Verizon','Pig','ISAC (towers that sense)','Dan Schulman, CEO'],['#8','att','AT&T','Pig','Open RAN (mix-and-match tower parts)','John Stankey, CEO'],['#9','tesla','Tesla','Pig','Optimus robots and SRAM','Elon Musk, CEO'],['#10','intel','Intel','Pig','Foundry (making chips for others)','Lip-Bu Tan, CEO']].map(function(r){return '<tr><td>'+r[0]+'</td><td>'+wl(r[1],r[2])+'</td><td>'+r[3]+'</td><td>'+r[4]+'</td><td>'+r[5]+'</td></tr>';}).join('')+
'</table>'+
'<h2>How to use this wiki</h2><p>Each company has its own page, laid out in the same 13 sections as the Muse_Data spreadsheet, plus its ownership links, its test, and who’s in charge. Concept pages explain '+wl('brendentest','The Brenden Test')+', '+wl('notation','The Notation')+', '+wl('anthropic')+', the '+wl('satellite','Satellite Joint Venture')+', '+wl('memory','The Memory Shortage')+', and '+wl('gates','The Tesla Three Gates')+'. Partner pages cover '+wl('berkshire','Berkshire Hathaway')+', '+wl('softbank','SoftBank')+', and '+wl('brookfield')+'. The '+wl('watchlist')+' holds things that can’t be written as links yet. '+wl('sources','Sources and Labels')+' explains what PROVEN, REPORTED, and n/r mean. '+wl('blackrock','BlackRock')+' — the biggest holder of the ten — has its own short page too.</p>'+
'<h2>The main objective</h2><p>Avoiding market slides like Oct 29–30, 2026 matters more than the weekly video. The video is how Brenden learns and presents; the web of ledgers is what decides when to reduce holdings. The working hypothesis (until disproven): selloffs like Oct 29–30 are <b>not</b> caused by a small revenue miss alone — the miss is the trigger, not the cause. The cause is stretched valuation (prices already high) plus profit-taking after a run, plus spending outrunning cash.</p>'
};
P.brendentest = { title:"The Brenden Test", cat:"Concepts", tag:"The decision rule for the whole index",
body:'<p>The Brenden Test is one question: <b>“Does the spending earn its money back?”</b> It is the decision rule for the whole index. A company is spending billions building data centers and buying chips. The test asks whether that spending turns into money coming back — in revenue, profit, and cash — or whether the company is just burning cash and hoping.</p>'+
'<h2>How the test works</h2><p>The test uses the public filings (the financial reports companies must file), not headlines. Four things get checked:</p><ul>'+
'<li>Cash CapEx (capital spending — money spent on buildings and equipment) against operating cash flow (cash the business actually brings in). If spending is bigger than the cash coming in, the company is funding the gap somehow — from savings or debt.</li>'+
'<li>ROIIC (return on incremental invested capital) — how much extra profit each new dollar of spending produces.</li>'+
'<li>Utilisation and backlog — whether the data centers being built are actually being used, and whether customers have committed to pay for them.</li>'+
'<li>Debt and maturities — how much the company owes, and when it has to pay it back.</li></ul>'+
'<h2>The cash-test scoreboard (filing-verified)</h2><p>'+wl('microsoft')+' passes: in the September 2026 quarter, operating cash flow was $58.0B against cash CapEx of $39.367B, leaving free cash flow (cash left after spending) of $18.633B <span class="label proven">PROVEN · 10-Q</span>. Nine of the ten pass the cash test. Alphabet’s September-quarter cash test is not published in this wiki (on hold).</p>'+
'<h2>The test in algebra</h2><p>In '+wl('notation','The Notation')+', the test is written as an edge: <span class="notation">A(-b)</span> means company A spent money buying into partner b. The edge only closes when b goes positive — when the investment pays back more than it cost. If b never goes positive, the edge never closes, and it is a <i>failed instantiation</i> (a deal that never paid off).</p>'+
'<h2>The Microsoft version</h2><p>For '+wl('microsoft')+', the test has a specific form, worked out by Brenden in November 2026: losing competitiveness would show up in the public filings as CapEx declining at the same time as Azure revenue growth declining. The pair is the test. CapEx falling alone could mean the Maia chip is doing more with less — efficiency, not decline. Growth is what decides which it is. CapEx lives on the cash flow statement; Azure revenue lives on the income statement — not the balance sheet. Caveat: the signal matters most while the AI market is still growing; it is weaker once the market saturates (stops growing).</p>'+
'<p class="small">See also: each company page carries its own version of the test under “The Test.”</p>' };
P.notation = { title:"The Notation", cat:"Concepts", tag:"Brenden’s shorthand for the ownership web · invented Nov 19, 2026",
body:'<p>The Notation is Brenden’s own shorthand for the ownership web, invented Nov 19, 2026. It writes every link between companies as a short term, so the whole web reads like algebra.</p>'+
'<h2>The three forms</h2><ul>'+
'<li><span class="notation">A(b)</span> — partner b holds a piece of index company A. Cash <b>in</b> from A’s side. Example: <span class="notation">AAPL(BRK)</span> means '+wl('berkshire','Berkshire Hathaway')+' owns '+wl('apple','Apple')+' shares.</li>'+
'<li><span class="notation">A(-b)</span> — company A spent money to buy into partner b. Cash <b>out</b> from A’s side. Example: <span class="notation">GOOGL(-ANT)</span> means '+wl('alphabet','Alphabet')+' paid to buy into '+wl('anthropic')+'. The edge only closes when b goes positive — when the investment pays back. Otherwise it is a failed instantiation.</li>'+
'<li><span class="notation">A{B}</span> — an index company holds another index company. Curly braces, decided Nov 20, 2026. Example: <span class="notation">INTC{NVDA}</span> means '+wl('nvidia','Nvidia')+' holds '+wl('intel','Intel')+' shares. Parentheses stay partner-only.</li></ul>'+
'<h2>Bridges</h2><p>When one partner connects two index companies, it reads <span class="notation">A1(b)A2</span>. Example: <span class="notation">GOOGL(ANT)NVDA</span> would mean '+wl('anthropic')+' connects '+wl('alphabet')+' and '+wl('nvidia')+' (both hold Anthropic). '+wl('blackrock')+' holds all ten, so it bridges all 45 pairs.</p>'+
'<h2>The rules (decided Nov 19–20, 2026)</h2><ul>'+
'<li>Variables are tickers (NVDA, AAPL), not numbers. Ranks change; tickers don’t, so old entries stay readable.</li>'+
'<li><b>No edge until b is named</b> (standing rule, Nov 20, 2026). An edge is written only when the partner is named or the entity exists. Unnamed items stay on the '+wl('watchlist')+'. Brenden’s reason: the name is what makes tracking possible.</li>'+
'<li>The '+wl('satellite','satellite joint venture')+' stays a three-way placeholder until it is named, then it is written once. No two-way term, because that would hide T-Mobile as the third owner.</li>'+
'<li>Open question: does an <span class="notation">A(b)</span> edge ever close? Closing is defined only for <span class="notation">A(-b)</span> edges. Brenden’s answer so far: “I don’t know yet.”</li></ul>'+
'<h2>The count</h2><p><b>123 edges:</b> 54 cash-in <span class="notation">A(b)</span>, 68 cash-out <span class="notation">A(-b)</span>, and 1 curly-brace <span class="notation">INTC{NVDA}</span>. Two items moved off the edge list onto the watchlist when the no-edge-until-named rule was adopted (count 125 → 123): Apple’s Gui’an data center and Alphabet’s $20B unnamed derivative.</p>' };
P.anthropic = { title:"Anthropic", cat:"Concepts", tag:"The biggest shared asset in the web · five of the ten bought in",
body:'<p>Anthropic is the AI company behind Claude, a chatbot and AI assistant. It is the biggest shared asset in the Monkey Pig web: five of the ten bought into it together.</p>'+
'<h2>The $26B placement</h2><p>Before the IPO, Anthropic sold $26B of Class N shares (a special class of stock) in a private placement to seven buyers. Five of the ten took part: '+wl('alphabet')+' $10B, '+wl('nvidia')+' $10B, '+wl('micron')+' $1B, '+wl('microsoft')+' $1B, '+wl('tsmc','TSMC')+' $500M (amounts <span class="label reported">REPORTED</span>; participation <span class="label proven">PROVEN</span>). AMD ($2.5B) and Broadcom ($1B) also took part — they are outside the ten. Alphabet also holds an earlier stake of about 14% <span class="label proven">PROVEN</span>. A separate April 2026 $10B Alphabet investment (Series H) is <b>UNRECONCILED</b> — it may overlap the placement or the 14% stake, so never add the figures together.</p>'+
'<h2>The IPO</h2><p>Anthropic priced its IPO at <b>$83 a share on Nov 18, 2026</b>, above the $70–$78 range. First trading was Thu Nov 19 on Nasdaq as ANT: first trade $111.50, day-one close $97.17 (up 17% on $83). The offering formally closed Fri Nov 20, 2026, with the underwriters (the banks running the sale) buying every extra share they were allowed — 1.127 billion shares, about $93.5B gross, the largest IPO on record. The $26B placement closed with it, so the five placement edges went from “agreed” to “held.” On Friday Nov 20, ANT closed around $88–89 (sources differ slightly: $88.91 or $88.30), touching $83.05 intraday but never closing below $83 — so the five placement edges stayed b-positive (above what the five paid), just barely.</p>'+
'<h2>Why it matters to the ten</h2><p>Anthropic is a customer as well as an investment: it rents enormous amounts of computing power. Its filing discloses about <b>$900.9B in committed spending through 2045</b>, mostly renting compute rather than owning data centers, with about $451.6B due before the end of 2030. '+wl('microsoft')+' has committed at least $47.2B and '+wl('alphabet')+' at least about $121.3B of that. Anthropic’s revenue was $33.2B in the first nine months of 2026. In the notation, the five placement edges (<span class="notation">GOOGL(-ANT)</span>, <span class="notation">NVDA(-ANT)</span>, <span class="notation">MSFT(-ANT)</span>, <span class="notation">MU(-ANT)</span>, <span class="notation">TSM(-ANT)</span>) close — go positive — when ANT trades above the $83 the five paid.</p>' };
P.satellite = { title:"Satellite Joint Venture", cat:"Concepts", tag:"“Big 3 cellular is going interstellar.” — Brenden’s headline",
body:'<p><i>“Big 3 cellular is going interstellar.”</i> — Brenden’s headline for this story.</p>'+
'<h2>What it is</h2><p>'+wl('att','AT&T')+', '+wl('verizon')+', and T-Mobile formed a satellite joint venture to end dead zones — places where phone towers don’t reach. The venture will offer satellite coverage that connects directly to ordinary phones (direct-to-device), filling the gaps where towers don’t reach and backing up the network when the ground system fails. Agreement in principle May 14, 2026; definitive agreement signed Oct 1, 2026 <span class="label proven">PROVEN</span>.</p>'+
'<h2>Who’s in charge</h2><p>Interim CEO <b>Paul Roth</b> (former AT&T/Cingular executive). No permanent CEO has been named. The venture itself is still unnamed — no name, no permanent chief, no launch date. That freshness is the story.</p>'+
'<h2>How it works</h2><p>The venture owns no satellites. It pools the three carriers’ spectrum (the radio frequencies phones use) and buys satellite coverage from satellite companies. Towers stay primary — satellites fill the gaps. '+wl('att','AT&T')+'’s own satellite partner is '+wl('ast','AST SpaceMobile')+'; '+wl('verizon')+' works with AST SpaceMobile and Skylo. T-Mobile also has a separate direct satellite partner outside the venture. So this is not simply the carriers versus one satellite company — it is the three teaming up so no single satellite company owns the whole game.</p>'+
'<h2>In the notation</h2><p>The venture is a three-way placeholder until it is named, then it will be written once (decided Nov 20, 2026). No two-way term, because that would hide T-Mobile as the third owner. T-Mobile qualifies for its own partner ledger (publicly traded, linked to two of the ten through the venture) but it is not built yet.</p>' };
P.memory = { title:"The Memory Shortage", cat:"Concepts", tag:"Brenden’s supply-side test · locked Nov 5, 2026",
body:'<p>Memory (the chips that store and move data — DRAM and NAND, plus HBM, the stacked fast memory AI needs) has been in short supply since COVID. Prices rose first. The theory, locked Nov 5, 2026: prices drop only when the shortage is fixed from the supply side — new capacity, more output, prices falling because there is more to buy. Demand breaking (people stop buying because prices are too high) does <b>not</b> count as the shortage being fixed.</p>'+
'<h2>The test</h2><p>Refined by Brenden on Nov 17, 2026: the test is '+wl('micron')+'’s inventory assets going up and staying steady for two quarters. Inventory up because Micron is making more, not because nobody is buying. That is what separates the trigger from demand breaking. Note: assets going up alone is <b>not</b> the trigger — a fab under construction doesn’t put memory on the shelf. The trigger needs supply actually arriving: output up, prices falling because there’s more to buy, or a buyer saying constraints eased because supply improved. <b>The trigger is still OPEN.</b></p>'+
'<h2>Two timelines</h2><p>Brenden’s framing (Nov 12, 2026): COVID triggered the shortage in 2020, the crisis peaked in 2021, and nearshoring (bringing chip-making back home) followed with 2022 law and land decisions and fab builds that take five to eight years. The AI data-center buildout was triggered separately at the end of 2022, and its money jumped in the first quarter of 2024. An AI data center is defined by what’s inside it — GPUs, accelerators, and stacked fast memory — not by the building.</p>'+
'<h2>Who’s on which side</h2><p>'+wl('micron')+' sells memory, so the shortage lifts Micron. '+wl('apple')+' buys memory, so the same shortage squeezes Apple’s margins. They are on opposite sides of the same shortage.</p>' };
P.gates = { title:"The Tesla Three Gates", cat:"Concepts", tag:"Brenden’s theory for Tesla · set Nov 6, 2026",
body:'<p>Brenden’s theory for '+wl('tesla')+', set Nov 6, 2026. It has three gates (stages), each bigger than the last, and it assumes the memory bottleneck is holding Tesla’s price back (that assumption is <span class="label unv">UNVERIFIED</span>). The theory is “Storonsky-gated” — named for Nik Storonsky, the founder-operator Brenden tracks as the model of a trader who runs a company like a trader.</p>'+
'<h2>Gate 1 — NVIDIA escape (May 2027)</h2><p>Tesla designs its own SRAM (static memory — fast, small memory built into chips). If Tesla can design its own memory, it escapes depending on '+wl('nvidia','Nvidia')+'’s chips. Trigger: an SRAM-design headline is a buy alert on the Tesla–Nvidia pair.</p>'+
'<h2>Gate 2 — Terafab volume (Q3 2028)</h2><p>Tesla finds a way to make its own SRAM at volume in Terafab, its planned chip plant in Grimes County, Texas ($16.8B first phase, announced Aug 6, 2026). Trigger: Terafab updates are an alert on the Tesla–'+wl('tsmc','TSMC')+' pair, in either direction. TSMC’s condition, set by CEO C.C. Wei: TSMC doesn’t rent its fabs — if TSMC is in, TSMC runs the fab, because the chip-making process <i>is</i> the company.</p>'+
'<h2>Gate 3 — Optimus deployment</h2><p><i>First outside-company deliveries planned end 2027, at volume after Q3 2028.</i> Optimus robots ship to consumers with Tesla’s own SRAM inside. This is the <b>SELL call</b> — the one exception to Brenden’s “just fucking hold” motto. Brenden’s reason (Nov 17, 2026): once Optimus is shipping to consumers, most of the leg work is already done — the story is realized, so sell despite any hype around the launch.</p>'+
'<h2>Related watch</h2><p>If '+wl('tesla')+' makes a deal with '+wl('micron')+', flag it early — take the signal before Wall Street prices it in. (No such deal has been announced. A Nov 3 feed claim of a Micron–Tesla memory allocation deal was corrected in the feed on Nov 4 — it is not a live deal.)</p>' };
</script>
<script>
function ib(title, rows){ var h='<div class="infobox"><div class="ib-title">'+title+'</div><table>'; rows.forEach(function(r){ h+='<tr><th>'+r[0]+'</th><td>'+r[1]+'</td></tr>'; }); return h+'</table></div>'; }
function finTable(rows){ var h='<table class="data"><tr><th>Year</th><th class="num">Revenue</th><th class="num">Free cash flow</th><th class="num">Cash &amp; investments</th><th class="num">Total debt</th></tr>'; rows.forEach(function(r){ h+='<tr><td>'+r[0]+'</td><td class="num">'+r[1]+'</td><td class="num">'+r[2]+'</td><td class="num">'+r[3]+'</td><td class="num">'+r[4]+'</td></tr>'; }); return h+'</table>'; }

P.nvidia = { title:"Nvidia", cat:"Companies", tag:"Nvidia Corporation · NVDA · Monkey · EBITA rank #1",
infobox: ib("Nvidia Corporation (NVDA)", [["Tranche","Monkey"],["EBITA rank","#1 of 10 ($198.29B)"],["Fiscal year","Ends late January"],["Interim CEO","Colette Kress (also CFO)"],["Board chair","Harvey C. Jones"],["Key project","Vera Rubin chips"],["Camera line","“Is the spending paying for itself?”"]]),
body:'<p><b>Nvidia</b> makes the chips that run AI — the graphics processors (GPUs) inside nearly every AI data center. It is the supplier, not the spender: other companies buy Nvidia’s chips to build their data centers. Data Center revenue is <b>92.9%</b> of Nvidia’s total revenue. The question that decides whether Nvidia is in trouble is not its stock price — it is whether Data Center revenue keeps growing.</p>'+
'<h2>1. At a Glance</h2><p>CapEx (spending on buildings and equipment) grew 86.7% in FY2026 to $6.042B — but from a small base; Nvidia’s own spending is tiny next to the hyperscalers (the giant cloud companies) because Nvidia sells the picks and shovels rather than digging. Data Center revenue was $193.7B in FY2026, up 68.2%. Financing verdict: self-funded, free cash flow squeezed but positive. Signal: <b>GROWING</b> (as supplier).</p>'+
'<h2>2. Spending</h2><p>CapEx by year ($B): 2022 $0.976 · 2023 $1.833 · 2024 $1.069 · 2025 $3.236 · 2026 $6.042. FY2026 is 6.2× FY2022, but the absolute number is small next to the cloud giants. R&amp;D (research and development) was 8.6% of revenue in 2026, falling from 27.2% in 2023 as revenue outgrew research spending. Last four quarters of CapEx: Oct 2025 $1.636B, Jan 2026 $1.284B, Apr 2026 $1.757B, Jul 2026 $2.677B.</p>'+
'<h2>3. Profitability</h2><p>Gross margin (the share of revenue left after the direct cost of making the product): 2022 64.9% · 2023 56.9% · 2024 72.7% · 2025 75.0% · 2026 71.1%. The 2023 dip was the pre-AI inventory correction; 71.1% in FY2026 is still about 6 points above FY2022. FY2026: gross profit $153.46B on revenue of $215.94B.</p>'+
'<h2>4. Financial Position</h2><p>Revenue, free cash flow (cash left after spending), cash and short-term investments, and total debt ($B). Total debt here means borrowings plus finance leases, not counting operating leases.</p>'+finTable([["FY2024","$60.92","$27.02","$25.98","$9.71"],["FY2025","$130.50","$60.85","$43.21","$8.46"],["FY2026","$215.94","$96.68","$62.56","$8.47"]])+'<p>Net cash (more cash than debt): $54.09B. Operating cash flow n/r in this table.</p>'+
'<h2>5. Operations</h2><p>No Nvidia-owned hyperscale AI campus is verified — Nvidia is the supplier, not a campus owner. Its DSX Pod (a shipping-container unit holding 7 Vera Rubin racks) is a product, with deliveries expected early 2027. Reference only (customers, <b>not</b> Nvidia’s own sites): Stargate Abilene in Texas (Crusoe/Oracle for '+wl('openai','OpenAI')+', using Nvidia GB200 chips) — 1.2 GW total planned, 8 buildings, first 2 operating since Sep 2025 with 200+ MW; 6 of 8 delivered per an Oct 14, 2026 tracker — do not present as fully complete. Meta’s Hyperion (Louisiana, 5 GW planned) and Prometheus (Ohio, 1 GW scaling to 1.5 GW) — no confirmed full energized figure as of Oct 28, 2026.</p>'+
'<h2>6. Outlook</h2><p>No own-CapEx guidance. FY2028 revenue growth outlook about 70% (raised to about 75% on the Nov 17, 2026 earnings call — see The Test). Customer cloud backlog over $2T is an industry figure, <b>not</b> Nvidia’s own backlog (RPO, or remaining performance obligation — money customers have committed to pay). Nvidia’s supply-related commitments were $119B (press) at the sheet cutoff; the Nov 17 earnings release put supply and capacity commitments at $390B, up from $279B the quarter before. No cuts or pauses found.</p>'+
'<h2>7. Notes, Risks, and Sources</h2><ul><li>Q2 FY2027 (ended Jul 26, 2026): revenue $96.22B, up 106% year-on-year, up 18% on the quarter.</li><li><span class="label unv">UNVERIFIED</span> — do not present as settled: one aggregator shows long-term debt of $32.366B at Jul 2026 vs $7.469B at Jan 2026. Needs 10-Q verification.</li><li>Sources: Finbox, Macrotrends, Fool (FY2028 outlook, Q2 FY2027 call).</li></ul>'+
'<h2>8. Consensus — Latest Full Year</h2><p>FY2026, ended Jan 2026 — Revenue $215.94B · Free cash flow $96.68B · Cash &amp; short-term investments $62.56B · CapEx $6.04B · R&amp;D $18.50B · Gross margin 71.1%.</p>'+
'<h2>9. EBITA</h2><p>Rank #1 of 10. Trailing-twelve-months EBITA <b>$198.29B</b> (operating income $197.58B + amortization $0.71B). Period: Jul 27, 2025 to Jul 26, 2026. EBITA share: 21.1% of the ten-company total.</p>'+
'<h2>10. Latest Balance Sheet (Jul 26, 2026)</h2><p>Total assets $320.3B · Cash $22.4B · Short-term investments $76.9B · Receivables (money owed by customers) $63.1B · Inventory $31.6B · Property, plant and equipment $14.3B · Long-term investments $51.2B.</p>'+
'<h2>11. Assets History</h2><p>Total assets: FY2015 $7.2B · FY2020 $17.3B · FY2026 $206.8B.</p>'+
'<h2>12. Assets Year-on-Year</h2><p>FY2026 total assets up 85.3% on the year. The growth is accelerating: +59.6% (FY2024), +69.8% (FY2025), +85.3% (FY2026).</p>'+
'<h2>13. Top Shareholders</h2><p>Top 5 holders, shares held, Q3 2026 (Sep 30, 2026) vs 2020 <span class="label proven">PROVEN · SEC 13F</span>. 1. '+wl('blackrock','BlackRock')+' 1,940.9M vs 1,792.0M. 2. Vanguard Capital Mgmt 1,540.6M vs ~1,920.0M. 3. State Street 1,025.1M vs 988.2M. 4. FMR (Fidelity) 932.8M vs 1,741.0M — Fidelity cut 93.2M shares in Q3 2026, about 9%, the biggest cut by share count in the quarter. 5. Geode 613.7M vs 380.1M. Note: Vanguard split into two separately filing advisers in Jan 2026; the 2020–2025 figures are the old combined Vanguard, the 2026 figure is Vanguard Capital Mgmt only — the apparent drop is not selling. Combined, Vanguard is the largest Nvidia holder (2,052.8M shares).</p>'+
'<h2>Stakes It Holds</h2><p>Nvidia holds stakes in <b>19 partners</b> (cash out — it spent to buy in). The biggest: '+wl('anthropic')+' $10B in the placement (<span class="notation">NVDA(-ANT)</span>); '+wl('openai','OpenAI')+' $30B direct equity, Feb 2026 round <span class="label reported">REPORTED</span>; MediaTek $3.5B convertible bonds (Aug 31, 2026) <span class="label proven">PROVEN</span>; '+wl('marvell')+' $2.0B convertible preferred (Mar 31, 2026) <span class="label proven">PROVEN</span>; Lumentum $2.0B convertible preferred <span class="label proven">PROVEN</span>; SB Energy $1.5B prepaid forward plus $1.5B further commitment; CoreWeave 47,213,353 shares, $4.11B (Q3 13F) <span class="label proven">PROVEN</span>; Coherent 7,788,161 shares, $2.24B (Q3 13F); Synopsys 4,354,077 shares, $1.89B (Q3 13F); Nokia ADR 72,859,751 shares, $738.8M (Q3 13F); Nebius beneficial 22,256,412 shares, 9.3% of class <span class="label proven">PROVEN</span>; Corning warrants, $500M paid <span class="label proven">PROVEN</span>; IREN investment rights up to 30,000,000 shares at $70 (paid nothing) <span class="label proven">PROVEN</span>; '+wl('verily')+' equity investor Sep 9, 2026 <span class="label proven">PROVEN</span>, amount n/r; '+wl('mistral','Mistral AI')+' Series B/C/D participant <span class="label reported">REPORTED</span>, amounts n/r; '+wl('figure','Figure AI')+' Series B + C <span class="label reported">REPORTED</span>, amounts n/r; Generate Biomedicines 833,325 shares, $12.5M (Q3 13F); Helix Digital Infrastructure founding investor <span class="label reported">REPORTED</span>, commitment n/r; '+wl('brookfield')+' AI Infrastructure Fund anchor investor, $2B <span class="label reported">REPORTED</span> (single-source, unconfirmed). Plus the index-holds-index stake: <span class="notation">INTC{NVDA}</span> — 161,082,488 '+wl('intel')+' shares, $19.37B (Q3 13F) <span class="label proven">PROVEN</span>, cut from 214,776,632 in Q2. The <b>only</b> direct holding link between any two of the ten.</p>'+
'<h2>The Test</h2><p>Brenden’s call (Nov 14, 2026): “Nvidia is about to tank.” The test: Data Center revenue shrinking two quarters running. Q3 FY2027 (reported Nov 17, 2026, from Nvidia’s own 8-K): total revenue $115.8B beat the $108B guide; Data Center $107.6B, up 21% on Q2’s $89.0B (Hyperscale $60.1B, AI Clouds/Industrial/Enterprise $47.5B), 92.9% of revenue; adjusted EPS $2.68; gross margin 74.8%; Q4 guide $130.0B ±3% (vs ~$125B analyst average) with margin guide stepping down to 71–72%; free cash flow $43.8B; operating cash flow $48.3B; $28.1B returned to shareholders; supply commitments $390B (up from $279B); total future commitments $518B; guarantees $118B maximum exposure (no payments made); Vera Rubin NVL72 shipping, called the fastest product ramp in company history.</p><div class="callout"><b>Tank-call check 1 of 2: FAILS, decisively.</b> For the call to hold, Data Center must now shrink in Q4 FY2027 <i>and</i> Q1 FY2028 — and the $130B Q4 guide points the other way.</div><p>On the earnings call, interim CEO Colette Kress raised the FY2028 growth outlook to about 75% (from 70%); said financing guarantees only switch on once a data center is built (“no building, no guarantee”); Hopper shipments to China have stopped and Q4 guidance assumes zero China Data Center revenue. Shares closed Nov 17 at $155.46 (−0.44%), rose about 3.6% after hours to $161.04, then closed Nov 18 at $150.96 (−2.89%) — the after-hours gain fully reversed. The price move does not change the tank-call test, which is about Data Center revenue, not price.</p>'+
'<h2>Who’s in Charge</h2><p>Colette Kress, interim CEO since Nov 12, 2026, keeping her CFO role (CFO since Sep 2013). Harvey C. Jones, Nvidia’s first-ever board chair (director since 1993). Jensen Huang resigned as CEO on Nov 12, 2026, effective immediately; the board accepted his resignation and does not intend to reinstate him. The board hired Heidrick &amp; Struggles to run the CEO search and will not rush it — Jones: “We will not find a Jensen clone.” At Kress’s first all-hands on Nov 18, she announced pay raises and additional equity awards in December, months earlier than scheduled.</p>'+
'<h2>On Camera</h2><p><b>READY</b> (drill 1, Nov 17). In Brenden’s words: steer off the stock price and ask “Is the spending paying for itself?” The driver is chip revenue from data centers. Track Data Center revenue over two quarters. As of the latest earnings, the company is definitely not tanking.</p>' };

P.microsoft = { title:"Microsoft", cat:"Companies", tag:"Microsoft Corporation · MSFT · Pig · EBITA rank #2",
infobox: ib("Microsoft Corporation (MSFT)", [["Tranche","Pig"],["EBITA rank","#2 of 10 ($167.39B)"],["Fiscal year","Ends Jun 30"],["CEO","Satya Nadella"],["Key project","Maia chip and Copilot"],["Camera line","“The pair is the test — CapEx down AND Azure growth slowing.”"]]),
body:'<p><b>Microsoft</b> sells software that makes business easier — Windows, Office, and above all Azure, its cloud computing business. Its AI bet is Copilot (an AI assistant built into its software) running on Azure, increasingly on Microsoft’s own Maia chips. The question for Microsoft is not R&amp;D dollars — R&amp;D is AI spend — it is AI adoption: whether customers actually use Copilot, GitHub Copilot, and Azure AI.</p>'+
'<h2>1. At a Glance</h2><p>CapEx grew 80% in FY2026 to $115.9B (vs $64.6B). Calendar 2026 reported CapEx of ~$175B vs ~$190B is a reclassification only (accounting, not a real cut — see Notes). Commercial RPO (remaining performance obligation — money customers have committed to pay) $678B, up 84% year-on-year (+25% excluding '+wl('openai','OpenAI')+'). Financing verdict: self-funded, free cash flow squeezed but positive. Signal: <b>GROWING</b> (the reported line is misleading).</p>'+
'<h2>2. Spending</h2><p>CapEx by year ($B): 2022 $23.89 · 2023 $28.11 · 2024 $44.48 · 2025 $64.55 · 2026 $115.95. FY2026 is 4.9× FY2022. R&amp;D was 10.7% of revenue in 2026, drifting down from 12.8% in 2023 as revenue outgrew research spending. Q1 FY2027 (Sep 2026 quarter): total CapEx $45.2B as reported on the call (including finance leases) vs $34.9B a year ago; on a cash basis the 10-Q shows $39.367B cash CapEx, $58.0B operating cash flow, $18.633B free cash flow.</p>'+
'<h2>3. Profitability</h2><p>Gross margin: 2022 68.4% · 2023 68.9% · 2024 69.8% · 2025 68.8% · 2026 67.9%. Steady in the high 60s. FY2026: gross profit $225.47B on revenue of $331.84B.</p>'+
'<h2>4. Financial Position</h2><p>Revenue, free cash flow, cash and short-term investments, and total debt ($B). Total debt means borrowings plus finance leases, not counting operating leases.</p>'+finTable([["FY2024","$245.12","$74.07","n/r","$78.78"],["FY2025","$281.72","$71.60","n/r","$89.32"],["FY2026","$331.84","$66.99","$76.84","$106.89"]])+'<p>Net debt: $30.05B. Cash &amp; investments for 2022–2025 n/r in this pass — the row is offered, the value is not invented.</p>'+
'<h2>5. Operations</h2><ul><li><b>Fairwater 1</b> (Mount Pleasant, Wisconsin) — ALREADY BUILT, first facility complete and fully operational Jun 23, 2026; size disputed (~117 MW permit-based vs over 350 MW in other reports); $3.3B first facility.</li><li><b>Fairwater Atlanta</b> (Atlanta, Georgia, with QTS) — ALREADY BUILT, first AI superfactory Nov 2025; over 300 MW IT across two buildings, campus over 700 MW by end-2026 in one analysis (tracker/analyst-derived, not a single Microsoft filing figure).</li><li><b>Fairwater 2</b>, Wisconsin — BEING BUILT, expected online 2028, about 800 employees projected; MW n/r; 15 additional buildings approved Jan 2026 (approval is not construction started).</li></ul>'+
'<h2>6. Outlook</h2><p>Calendar 2026 CapEx about $175B; Q1 FY2027 CapEx over $50B; FY2027 CapEx to grow year-on-year (no company dollar figure); free cash flow to stay positive in FY2027. Backlog: commercial RPO $678B at FY2026 Q4, up 84% year-on-year (+25% excluding OpenAI), about 30% due in the next 12 months, weighted average duration 2.3 years — backlog, not cash in hand. Cuts/pauses: none. The calendar-2026 reported CapEx change from $190B to ~$175B is <b>accounting only</b> (useful life extended from 15 to 25 years; more leases shift from finance to operating, and operating leases are excluded from Microsoft’s CapEx measure). The CFO said that outside this impact, calendar-year 2026 CapEx expectations are unchanged.</p>'+
'<h2>7. Notes, Risks, and Sources</h2><ul><li>Do not splice FY2027 directly onto FY2026 without the lease-reclassification footnote — reported CapEx will fall even if cash spending is unchanged.</li><li>Debt definitions conflict across sources (about $40.3B to $106.89B depending on what is counted) — do not mix series.</li><li>Analyst FY2027 CapEx estimates range from $220.7B (BofA) to $255–260B — a $34–39B gap, and neither is company guidance.</li></ul>'+
'<h2>8. Consensus — Latest Full Year</h2><p>FY2026, ended Jun 2026 — Revenue $331.84B · Free cash flow $66.99B · Cash &amp; short-term investments $76.84B · CapEx $115.95B · R&amp;D $35.56B · Gross margin 67.9%.</p>'+
'<h2>9. EBITA</h2><p>Rank #2 of 10. Trailing-twelve-months EBITA <b>$167.39B</b> (operating income $163.19B + amortization $4.20B). Period: Oct 1, 2025 to Sep 30, 2026. EBITA share: 17.8% of the ten-company total.</p>'+
'<h2>10. Latest Balance Sheet (Sep 30, 2026)</h2><p>Total assets $779.4B · Cash $20.3B · Short-term investments $44.2B · Receivables $62.1B · Inventory $1.8B · Property, plant and equipment $346.8B · Long-term investments $37.8B.</p>'+
'<h2>11. Assets History</h2><p>Total assets: FY2015 $174.5B · FY2020 $301.3B · FY2026 $758.4B.</p>'+
'<h2>12. Assets Year-on-Year</h2><p>FY2026 total assets up 22.5% on the year. Growth stepped up from about 9–13% (FY2021–23) to 24.3% / 20.9% / 22.5% (FY2024–26); property, plant and equipment up 52.7% in FY2026.</p>'+
'<h2>13. Top Shareholders</h2><p>Top 5 holders, shares held, Q3 2026 (Sep 30, 2026) vs 2020 <span class="label proven">PROVEN · SEC 13F</span>. 1. '+wl('blackrock','BlackRock')+' 607.1M vs 515.5M. 2. Vanguard Capital Mgmt 486.1M vs 614.0M. 3. State Street 320.7M vs 299.1M. 4. FMR (Fidelity) 203.8M vs 222.3M — Fidelity added 17.8M shares in Q3 2026 (+9.58%) while cutting '+wl('nvidia')+'. 5. Geode 192.4M vs 117.8M. Vanguard entity split note: the 2020–2025 figures are the old combined Vanguard; the 2026 figure is Vanguard Capital Mgmt only — the apparent drop is not selling. Combined, Vanguard is the largest Microsoft holder (653.3M shares).</p>'+
'<h2>Stakes It Holds</h2><p>Microsoft holds stakes in <b>11 partners</b>. The biggest: '+wl('openai','OpenAI')+' — about 24% as-converted at Sep 30, 2026, with $13.0B committed and $12.0B funded <span class="label proven">PROVEN</span>; '+wl('anthropic')+' — up to $5B agreed Nov 2025 plus $1B in the $26B placement <span class="label reported">REPORTED</span>; G42 — $1.5B minority stake, Apr 2024 <span class="label proven">PROVEN</span>; '+wl('mistral','Mistral AI')+' — €15M convertible Feb 2024 (under 1%) plus M12 Series B/C co-investment <span class="label reported">REPORTED</span>; '+wl('figure','Figure AI')+' Series B <span class="label reported">REPORTED</span>; subsea cables — 25% of MAREA <span class="label proven">PROVEN</span>, Amitié (% n/r, Meta majority), 16.6634% of New Cross Pacific <span class="label proven">PROVEN</span>, SEA-ME-WE 6 consortium member (% n/r), I-2SEA (% n/r). LSEG: about 4% bought Dec 2022 <span class="label proven">PROVEN purchase</span> — current holding n/r, on the '+wl('watchlist')+' until re-checked.</p>'+
'<h2>The Test</h2><p>The signal is AI adoption (Copilot usage, Azure AI demand, GitHub Copilot), not R&amp;D dollars. Cortana, Microsoft’s retired AI assistant (retired 2023), is the cautionary tale — it is <b>not</b> still running alongside Copilot. Copilot is the bet that adoption sticks this time. Brenden’s reframed test (Nov 17–18, 2026): “will Copilot stay the flagship” is the wrong question — Microsoft sells software that makes business easier, AI tools are today’s product, built on Maia chips. The real test is when Microsoft’s exponential market-share gains start flattening. Losing competitiveness would appear in the public filings as <b>CapEx declining coinciding with Azure revenue growth declining</b> — the pair is the test. CapEx down alone could be Maia efficiency (doing more with less); growth is what decides which it is. CapEx is on the cash flow statement, Azure revenue on the income statement — <b>not</b> the balance sheet. Caveat: the signal is crucial while the AI market is still growing, weaker once the market saturates.</p><p>Maia tracking (priority 1): Maia 200 in production, Maia 300 deployments in 2027, planned as the primary inference system from 2027; Azure runs on '+wl('nvidia','Nvidia')+' and Maia, Nvidia still dominant for frontier training. Azure revenue in the September quarter was $33.2B (+48%), and annual Azure revenue has crossed $100B. Microsoft CapEx for calendar 2026 is about $170B, with over $50B expected in Q2 FY2027. The “Azure mess” under watch: complexity and sprawl, rented neocloud capacity under review, $364.6B of leases not yet commenced. Windows is the delivery vehicle: Windows OEM/devices revenue was $3,551M, down 22% in Q3 (10-Q) <span class="label proven">PROVEN</span> (end-of-support comparison, inventory, and weak PC demand — not memory costs). Maia is in-house only, not for sale.</p>'+
'<h2>Who’s in Charge</h2><p>Satya Nadella, chairman and CEO. Scott Guthrie, executive vice president for Cloud + AI (in charge of Maia and Azure). Arun Ulag, Azure Core leader since Oct 12, 2026.</p>'+
'<h2>On Camera</h2><p><b>READY</b> (drill 4, Nov 17; retake drilled Nov 18). In Brenden’s words: losing competitiveness would appear in the public filings as CapEx declining coinciding with Azure revenue growth declining — the pair is the test. CapEx down alone could just be Maia doing more with less.</p>' };

P.apple = { title:"Apple", cat:"Companies", tag:"Apple Inc. · AAPL · Monkey · EBITA rank #3",
infobox: ib("Apple Inc. (AAPL)", [["Tranche","Monkey"],["EBITA rank","#3 of 10 ($162.96B)"],["Fiscal year","Ends late September"],["CEO","John Ternus (since Sep 1, 2026)"],["Key project","iPhone 20"],["Camera line","“Apple’s margins are getting squeezed by memory prices — the same shortage helping Micron.”"]]),
body:'<p><b>Apple</b> makes the iPhone and the devices and services around it. In the AI buildout, Apple is the opt-out: it spends under $15B a year on CapEx while '+wl('alphabet')+' spends $195–205B. Apple buys memory rather than making it, so the memory shortage squeezes Apple while it lifts '+wl('micron')+' — the two are on opposite sides of the same shortage.</p>'+
'<h2>1. At a Glance</h2><p>No CapEx growth reported; press estimates put FY2026 CapEx at $13–14B vs FY2025’s $12.7B (+2% to +10%, derived). Total CapEx under $15B vs Alphabet’s $195–205B — an opt-out, not a peak. No guidance. Financing verdict: self-funded, free cash flow squeezed but positive. Signal: <b>FLAT / OPT-OUT</b>.</p>'+
'<h2>2. Spending</h2><p>CapEx by year ($B): 2022 $10.708 · 2023 $10.959 · 2024 $9.447 · 2025 $12.715 · 2026 n/r (FY2026 unreported at the Oct 28, 2026 cutoff; 9 months to Jun 27, 2026: CapEx $6.799B, R&amp;D $34.035B — do <b>not</b> compare to full prior years). R&amp;D was 8.3% of revenue in 2025, creeping up from 6.7% in 2022. No AI CapEx inflection — about 1.0× baseline.</p>'+
'<h2>3. Profitability</h2><p>Gross margin: 2022 43.3% · 2023 44.1% · 2024 46.2% · 2025 46.9% · 2026 not reported at cutoff (the Sec 8 filing update gives 48.8%). FY2025: gross profit $195.20B on revenue of $416.16B. Services gross margin drove the rise (75.4% in FY2025 vs 71.7% in FY2022); products stayed around 36–37%.</p>'+
'<h2>4. Financial Position</h2><p>Revenue, free cash flow, cash and short-term investments, and total debt ($B). Total debt means borrowings plus finance leases, not counting operating leases.</p>'+finTable([["FY2023","$383.3","$99.6","$61.6","$112.11"],["FY2024","$391.0","$108.8","$65.1","$107.53"],["FY2025","$416.2","$98.8","$54.7","$99.89"]])+'<p>Net debt: $45.19B. Operating cash flow n/r in this table.</p>'+
'<h2>5. Operations</h2><ul><li><b>Apple Maiden expansion</b> (Maiden, North Carolina) — BEING BUILT, construction under way Oct 2026; MW not disclosed; $175M, 237,600 sq ft on existing land — an expansion, not a new gigawatt AI campus.</li><li><b>Apple Houston server factory</b> (Houston, Texas) — BEING BUILT, 250,000 sq ft <b>factory</b>, not a data center; mass production in 2026 for Apple Intelligence / Private Cloud Compute servers.</li><li>Apple is the largest customer at '+wl('tsmc','TSMC')+'’s Fab 21 in Arizona. Data-center expansions announced in NC, IA, OR, AZ, NV — but no gigawatt AI campus with disclosed MW found.</li></ul>'+
'<h2>6. Outlook</h2><p>No AI/data-center spending split disclosed. Total CapEx FY2025 $12.7B; FY2026 press estimate $13–14B (under $15B). No CapEx guidance disclosed — a gap. No comparable backlog/RPO figure found — a gap. Cuts/pauses: none found.</p>'+
'<h2>7. Notes, Risks, and Sources</h2><ul><li>FY2026 (ended late Sep 2026) had not yet been reported at the Oct 28, 2026 cutoff.</li><li>One aggregator mislabels millions as billions; its dollar columns were not used — margins check against the 10-K.</li></ul>'+
'<h2>8. Consensus — Latest Full Year</h2><p>FY2026, ended Sep 2026, 10-K Nov 3 — Revenue $478.83B · Free cash flow $136.06B · Cash &amp; short-term investments $136.94B · CapEx $9.04B · R&amp;D $45.77B · Gross margin 48.8%.</p>'+
'<h2>9. EBITA</h2><p>Rank #3 of 10. Trailing-twelve-months EBITA <b>$162.96B</b> (operating income $158.06B + amortization $4.90B). Period: Sep 27, 2025 to Sep 26, 2026. EBITA share: 17.4% of the ten-company total.</p>'+
'<h2>10. Latest Balance Sheet (Sep 26, 2026)</h2><p>Total assets $404.5B · Cash $36.3B · Short-term investments $20.4B · Receivables $83.7B · Inventory $14.5B · Property, plant and equipment $52.1B · Long-term investments $80.2B.</p>'+
'<h2>11. Assets History</h2><p>Total assets: FY2015 $290.3B · FY2020 $323.9B · FY2026 $404.5B.</p>'+
'<h2>12. Assets Year-on-Year</h2><p>FY2026 total assets up 12.6% on the year. Near-flat for years (0.5% / 0.0% / 3.5% / −1.6% in FY2022–25); the FY2026 jump was driven by inventory (+154.3%) and receivables (+14.7%).</p>'+
'<h2>13. Top Shareholders</h2><p>Top 5 holders, shares held, Q3 2026 (Sep 30, 2026) vs 2020 <span class="label proven">PROVEN · SEC 13F</span>. 1. '+wl('blackrock','BlackRock')+' 1,157.1M vs 1,056.5M. 2. Vanguard Capital Mgmt 955.2M vs 1,255.2M. 3. State Street 622.5M vs 638.2M. 4. Geode 375.2M vs 248.0M. 5. FMR (Fidelity) 370.0M vs 358.6M. Vanguard entity split note: the 2020–2025 figures are the old combined Vanguard; the 2026 figure is Vanguard Capital Mgmt only — the apparent drop is not selling. '+wl('berkshire','Berkshire Hathaway')+' also holds Apple: 227,917,808 shares, $66.0B, its #1 holding <span class="label reported">REPORTED · Q2 2026 13F; Q3 not yet re-checked</span> — see '+wl('berkshire','Berkshire Hathaway')+'.</p>'+
'<h2>Stakes It Holds</h2><p><b>None.</b> 0 JVs, 0 equity securities <span class="label proven">PROVEN · FY2026 10-K</span>. Apple is the only one of the ten with no stakes at all. The Gui’an iCloud data center (China, jointly built with GCBD) is on the '+wl('watchlist')+' — Apple put in about $1B <span class="label reported">REPORTED</span>, but there is no joint-venture entity and ownership % is n/r, so it is not an edge.</p>'+
'<h2>The Test</h2><p>Apple’s December-quarter margins are guided at <b>45–46%</b>, squeezed by memory costs — the same shortage lifting '+wl('micron')+' raises the cost of the memory in every iPhone. Costs squeeze margins, not the top line (top line means revenue). 45–46% is still healthy — the story is pressure, not collapse. December is Apple’s biggest quarter, so even a point of margin is real money. Apple is on the buying side of '+wl('memory','The Memory Shortage')+'.</p>'+
'<h2>Who’s in Charge</h2><p>John Ternus, chief executive since Sep 1, 2026.</p>'+
'<h2>On Camera</h2><p><b>READY</b> (drill 7, Nov 18). In Brenden’s words: memory costs squeeze December-quarter margins (guided 45–46%) in the holiday buying season. Micron and Apple are on opposite sides of the shortage.</p>' };
</script>

P.alphabet = { title:"Alphabet", cat:"Companies", tag:"Alphabet Inc. · GOOGL · Monkey · EBITA rank #4",
infobox: ib("Alphabet Inc. (GOOGL)", [["Tranche","Monkey"],["EBITA rank","#4 of 10 ($157.90B)"],["Fiscal year","Ends Dec 31"],["CEO","Sundar Pichai"],["Key project","Tensor chip and frontline consumer AI models"],["Camera line","“Cloud is where the growth test lives, but Search is still the cash cow funding the buildout.”"]]),
body:'<p><b>Alphabet</b> is Google’s parent company: Search, YouTube, Google Cloud, and the Tensor/TPU chips that run its AI. It is a growth company — valued on future revenue growth, not current cash flow alone — so its enormous data-center spending is growth investment. The sell test is whether that growth arrives, in Cloud revenue and backlog turning into cash, or slows.</p>'+
'<h2>1. At a Glance</h2><p>CapEx grew 103.5% in the first half of 2026 ($80.6B vs $39.6B, derived). Guidance: the 2026 guide was raised, and 2027 spending rises significantly (no dollar figure). Cloud backlog $514B, up 385% year-on-year. Signal: <b>GROWING</b>. (Alphabet’s September-quarter cash-test figures are not published in this wiki.)</p>'+
'<h2>2. Spending</h2><p>CapEx by year ($B): 2022 $31.485 · 2023 $32.251 · 2024 $52.535 · 2025 $91.447 · 2026 partial-year figure withheld. R&amp;D was 15.2% of revenue in 2025, roughly flat in the 14–15% range from 2022–2025. Quarterly CapEx 2025: Q1 $17.197 / Q2 $22.446 / Q3 $23.953 / Q4 $27.851; 2026 Q1 $35.674 / Q2 $44.924. First half 2026 actual $80.6B vs first half 2025 $39.6B.</p>'+
'<h2>3. Profitability</h2><p>Gross margin: 2022 55.4% · 2023 56.6% · 2024 58.2% · 2025 59.7% · 2026 not reported. Latest year (2025): gross profit $240.3B on revenue of $402.8B.</p>'+
'<h2>4. Financial Position</h2><p>Revenue, free cash flow, cash and short-term investments, and total debt ($B). Total debt means borrowings plus finance leases, not counting operating leases.</p>'+finTable([["FY2023","$307.39","$69.50","$110.92","$14.62"],["FY2024","$350.02","$72.76","$95.66","$15.86"],["FY2025","$402.84","$73.27","$126.84","$51.04"]])+'<p>Net cash: $75.80B. Cash &amp; investments here means cash plus marketable securities (the old cash-only series was far lower — do not mix).</p>'+
'<h2>5. Operations</h2><p>Alphabet is building data centers at many sites (MW figures are tracker-reported unless stated):</p><ul><li><b>Fort Wayne, Indiana</b> (Project Zodiac) — partially operating, construction continues, 400 MW, $2B campus.</li><li><b>Goodnight 1, Texas</b> (with Crusoe) — operating, Goodnight 2 under construction, 265.5 MW operational.</li><li><b>LaGrange, Georgia</b> — being built to 2029, first building ~50 MW, site eventually 400 MW, $1B new building, first building live late 2026/early 2027.</li><li><b>Michigan City, Indiana</b> (Project Maize) — being built, 200 MW, $832M, Phase I completed end 2026 (one tracker puts first building in service 2028–30 — conflict).</li><li><b>Kansas City, Missouri</b> (Project Ranger) — being built, MW not disclosed, 4 buildings, $1B, Building 1 operational Apr 2026.</li><li><b>Dorchester County, South Carolina</b> — being built, 150 MW, $2B (part of $9B in South Carolina through 2027).</li><li><b>Van Buren Township, Michigan</b> (Project Cannoli) — site plan approved Oct 2026, ~1 GW, ~$2B, service Dec 2027.</li><li><b>Cheyenne, Wyoming</b> (Tembo, ex-Project Jade) — vertical construction 2027, full build 2031, 2.7 GW, ~$17B reported (not primary-confirmed).</li><li><b>Pine Island, Minnesota</b> — proposal filed Oct 2026, approval not confirmed, 780 MW proposed.</li><li><b>New Florence, Missouri</b> (Project Spade) — construction expected 2026, 1.2 GW target, part of $15B Missouri investment.</li><li><b>Hermantown, Minnesota</b> — proposed Oct 2026, MW/$ not disclosed.</li><li>Legacy campuses Council Bluffs, Iowa (350 MW) and Lenoir, North Carolina (150 MW) are long-running, not proven new AI capacity.</li></ul>'+
'<h2>6. Outlook</h2><p>2026 CapEx guide <b>$195–205B</b> (midpoint $200B); spending to rise significantly again in 2027 (no dollar figure). Prior ranges conflicted ($180–190B in one account, $175–185B in another — flagged). Backlog: Google Cloud backlog $514B; total-company RPO $519.5B at Q2 2026 (ended Jun 30, 2026); the $514B is up 385% on Q2 2025’s $106B; just over 50% falls due in the next 24 months. Cuts/pauses: none — guide raised.</p>'+
'<h2>7. Notes, Risks, and Sources</h2><ul><li>Debt definition conflict: one source shows FY2025 long-term debt of $59.29B, not $46.55B — do not merge series without checking leases and current portion.</li><li>Q3 2026 figures in the sheet are from secondary reporting of the earnings release, not a direct filing read — and are on hold here.</li></ul>'+
'<h2>8. Consensus — Latest Full Year</h2><p>2025 — Revenue $402.84B · Free cash flow $73.27B · Cash &amp; short-term investments $126.84B · CapEx $91.45B · R&amp;D $61.09B · Gross margin 59.7%.</p>'+
'<h2>9. EBITA</h2><p>Rank #4 of 10. Trailing-twelve-months EBITA <b>$157.90B</b> (operating income $156.98B + amortization $0.92B — filed floor; Q4 2025 amortization n/r). Period: Oct 1, 2025 to Sep 30, 2026. EBITA share: 16.8% of the ten-company total.</p>'+
'<h2>10. Latest Balance Sheet (Sep 30, 2026)</h2><p>Total assets $1,003.3B · Cash $56.3B · Short-term investments $208.8B · Receivables $72.8B · Inventory $13.3B · Property, plant and equipment $372.8B · Long-term investments $135.2B.</p>'+
'<h2>11. Assets History</h2><p>Total assets: FY2015 $147.5B · FY2020 $319.6B · FY2025 $595.3B.</p>'+
'<h2>12. Assets Year-on-Year</h2><p>FY2025 total assets up 32.2% on the year. Growth jumped from 11.9% (FY2024) to 32.2%, with property, plant and equipment up 44.2% and long-term investments up 80.8% in FY2025.</p>'+
'<h2>13. Top Shareholders</h2><p>Top 5 holders of Class A shares, Q3 2026 (Sep 30, 2026) vs 2020 <span class="label proven">PROVEN · SEC 13F</span>. 1. '+wl('blackrock','BlackRock')+' 459.0M vs 406.6M. 2. Vanguard Capital Mgmt 384.8M vs 460.0M. 3. FMR (Fidelity) 247.7M vs 254.5M. 4. State Street 242.3M vs 227.0M. 5. Geode 151.9M vs 97.2M. Vanguard entity split note: the 2020–2025 figures are the old combined Vanguard; the 2026 figure is Vanguard Capital Mgmt only — the apparent drop is not selling. Combined, Vanguard is the largest Alphabet holder (481.8M Class A shares). '+wl('berkshire','Berkshire Hathaway')+' also holds Alphabet: 78,791,167 Class A + 27,188,433 Class C = 106.0M shares, ~$37.8B, including a $10B private placement in Jun 2026 <span class="label reported">REPORTED · Q2 2026 13F; Q3 not yet re-checked</span> — see '+wl('berkshire','Berkshire Hathaway')+'.</p>'+
'<h2>Stakes It Holds</h2><p>Alphabet holds stakes in <b>12 partners</b>. The biggest: '+wl('anthropic')+' — about 14% existing stake <span class="label proven">PROVEN</span> plus $10B in the $26B placement (<span class="label reported">REPORTED</span> amount; participation <span class="label proven">PROVEN</span>); the Series H $10B is UNRECONCILED — do not sum. '+wl('ast','AST SpaceMobile')+' 8,943,486 shares, $526.4M (Q3 13F) <span class="label proven">PROVEN</span>; Qualcomm 2,976,982 shares, $547.9M (Q3 13F) <span class="label proven">PROVEN</span>; Arm 1,960,784 ADSs, $568.0M (Q3 13F) <span class="label proven">PROVEN</span> — Alphabet is the only one of the ten still holding Arm; PayPay 3,125,000 ADS, $49.1M (Q3 13F) <span class="label proven">PROVEN</span> (PayPay is '+wl('softbank','SoftBank')+'-group); '+wl('marvell')+' warrant for up to 58,970,907 shares at $206.58, expiring Aug 18, 2033, paid nothing for the warrant <span class="label proven">PROVEN</span>; '+wl('verily')+' minority investor after the Mar 2026 spin-out (% n/r); Crux AI data-center JV with Blackstone — Alphabet up to $10B backstops, Blackstone up to $5B, $16.8B in Alphabet backlog (agreement <span class="label proven">PROVEN</span>; Alphabet equity % n/r); 49.99% of combined GFiber + Astound, expecting $1.5B cash + $2.0B note (terms <span class="label proven">PROVEN</span>; agreed Mar 2026, close expected late 2026); Intrinsic–Foxconn robotics JV, announced Oct 2025 <span class="label reported">REPORTED</span>, terms n/r; TeraWulf penny warrants, 41,011,803 shares exercisable (7.6% of class), paid nothing <span class="label reported">REPORTED</span>; 16 part-owned subsea cables (counts <span class="label reported">REPORTED</span>; % n/r per cable). Plus 24 further Q3 13F positions, none an M&amp;P name, none shared with another of the ten. The $20B unnamed derivative is on the '+wl('watchlist')+'.</p>'+
'<h2>The Test</h2><p>Alphabet is a growth company — the CapEx surge is growth investment, debt-funded at the margin while free cash flow is negative. The sell test is whether the growth arrives (Cloud revenue, backlog converting to cash) or slows. Track data-center buildouts site by site alongside the balance sheet. ChatGPT/'+wl('openai','OpenAI')+' is the biggest threat — AI becoming the new “just google it.” Search is the cash cow funding the buildout; if ChatGPT bites, it bites there first. But Brenden’s ruling (Nov 17, 2026): falling Search revenue is <b>not</b> a sell theory. Watch it, don’t trade on it. The sell test stays Cloud revenue. See '+wl('brendentest','The Brenden Test')+'.</p>'+
'<h2>Who’s in Charge</h2><p>Sundar Pichai, chief executive of Alphabet and Google.</p>'+
'<h2>On Camera</h2><p><b>READY</b> (drill 5, Nov 17). In Brenden’s words: the biggest threat right now is ChatGPT. The number to track is Cloud revenue. Search is the cash cow funding the buildout.</p>' };

P.micron = { title:"Micron", cat:"Companies", tag:"Micron Technology · MU · Monkey · EBITA rank #5",
infobox: ib("Micron Technology (MU)", [["Tranche","Monkey"],["EBITA rank","#5 of 10 ($99.34B)"],["Fiscal year","Ends late Aug / early Sep"],["CEO","Sanjay Mehrotra"],["Key project","HBM4 memory + critical minerals NY deal"],["Camera line","“Inventory up because they’re making more, not because nobody’s buying.”"]]),
body:'<p><b>Micron</b> makes memory — the DRAM and NAND chips that store data, and HBM (high-bandwidth memory), the stacked fast memory that AI chips need. The memory shortage has made Micron’s year extraordinary: revenue more than tripled in FY2026. Micron sells memory, so the shortage lifts Micron — the opposite side from '+wl('apple')+', which buys it.</p>'+
'<h2>1. At a Glance</h2><p>CapEx guide raised by more than 25% vs the prior guide; FY2027 brings a meaningful step-up (no dollar figure). HBM 2026 production is 100% allocated/sold out. Financing verdict: net cash — AI CapEx not yet debt-funded (2026). Signal: <b>GROWING</b>.</p>'+
'<h2>2. Spending</h2><p>CapEx by year ($B): 2022 $12.067 · 2023 $7.676 · 2024 $8.386 · 2025 $15.857 · 2026 $30.712. FY2026 is 2.5× FY2022; the inflection is FY2025–FY2026. Net CapEx FY2026 was lower at $27.37B (net of incentives and proceeds). R&amp;D was 4.2% of revenue in 2026, collapsed from 10.2% in 2025 as revenue surged — R&amp;D $5.65B against revenue of $133.19B. Last four quarters (FY2026): Q1 $5.389 / Q2 $6.387 / Q3 $7.826 / Q4 $11.110.</p>'+
'<h2>3. Profitability</h2><p>Gross margin: 2022 45.2% · 2023 −9.1% · 2024 22.4% · 2025 39.8% · 2026 80.7%. FY2026: gross profit $107.50B on revenue of $133.19B. The sheet flags FY2026 for a 10-K check before on-camera use. The swing from −9.1% (FY2023, including about a $1.43B inventory write-down in one quarter) to 80.7% (FY2026) came from DRAM prices up about 180% and NAND up about 200% year-on-year plus the HBM mix; about 60% of FY2026 revenue came from data centers.</p>'+
'<h2>4. Financial Position</h2><p>Revenue, free cash flow, cash and short-term investments, and total debt ($B). Note: Micron’s total debt here is the old sheet series for this company (it differs from the uniform series); the long-term/current/lease split is n/r.</p>'+finTable([["FY2024","$25.11","$0.12","$9.15","$14.08"],["FY2025","$37.38","$1.67","$11.94","$14.58"],["FY2026","$133.19","$58.96","$73.45","$5.18"]])+'<p>Net cash: $68.27B. Operating cash flow n/r in this table. In FY2023 Micron issued debt while burning cash (long-term debt $6.8B → $13.1B, free cash flow −$6.1B); it swung to net cash of $68.3B in FY2026, helped by $12.75B of customer contract deposits — prepayments, not debt.</p>'+
'<h2>5. Operations</h2><ul><li><b>Micron Boise ID1</b> (Boise, Idaho) — BEING BUILT; part of an about $50B two-fab Boise plan; construction began Oct 2023; first wafer output mid-calendar 2027, pulled in from H2 2027 (PROVISIONAL).</li><li><b>Micron Boise ID2</b> — BEING BUILT; construction began 2026; initial wafers late calendar 2028.</li><li><b>Micron Clay, Fab 1</b> (Clay, New York) — BEING BUILT; up to $100B campus, 4 fabs, about 2.4M sq ft of cleanroom at full build; broke ground Jan 16, 2026, first concrete Jul 9, 2026 ahead of plan; production around 2030.</li><li><b>Micron Clay, Fabs 2–4</b> — GOING TO BE BUILT; Fab 2 construction H2 2028, Fab 3 2033, Fab 4 2039; full campus operational by about 2045 — a long-dated pipeline, not near-term AI capacity.</li></ul><p><b>Nearshoring in three buckets</b> (never lead with $118B alone): 1) the $3B supplier plan only — wafers and minerals — GlobalWafers $500M (Sherman, Texas, 10-year deal, one-sixth of the $3B), Indium Corp in Rome, New York (undisclosed), about $2.5B unnamed, possibly unspent headroom (“up to $3B”); 2) the $100B Syracuse factory over 20 years, <b>not</b> in the $3B; 3) the $15B Boise expansion through 2030, <b>not</b> in the $3B. Separate, <b>not</b> in $118B: Idaho community investments over $67M plus Micron Ventures’ $250M AI fund ($317M).</p>'+
'<h2>6. Outlook</h2><p>FY2026 CapEx guide over $25B (raised from about $20B); FY2027 meaningful step-up, no dollar figure. HBM 2026 production fully allocated/sold out under price-and-volume agreements; HBM4 ramp in H2 2026, HBM4E in calendar 2027; no AI/HBM dollar split disclosed. Backlog/RPO: no comparable figure found — a gap. Cuts/pauses: none — guide raised about $20B to over $25B (over +$5B), a real increase.</p>'+
'<h2>7. Notes, Risks, and Sources</h2><ul><li><b>FLAG FY2026 FOR 10-K CHECK:</b> revenue $133.19B, up 256% from $37.38B; definition conflict — adjusted free cash flow $62.31B vs $58.96B GAAP free cash flow; use one definition consistently.</li><li>Micron’s Q1 FY2027 guide: revenue $61.5B ±$1.5B, non-GAAP EPS $38.15 ±$1.00 (Form 8-K, Sep 30, 2026). Earnings date mid-December, UNCONFIRMED — most trackers say Wed Dec 16, some Dec 23, one Dec 15.</li></ul>'+
'<h2>8. Consensus — Latest Full Year</h2><p>FY2026, ended Sep 2026 — Revenue $133.19B · Free cash flow $58.96B · Cash &amp; short-term investments $73.45B · CapEx $30.71B · R&amp;D $5.65B · Gross margin 80.7% (needs FY2026 10-K check).</p>'+
'<h2>9. EBITA</h2><p>Rank #5 of 10. Trailing-twelve-months EBITA <b>$99.34B</b>, on an operating-income basis (amortization not separately disclosed; intangibles about $0.47B, immaterial). Period: Sep 4, 2025 to Sep 3, 2026. EBITA share: 10.6% of the ten-company total.</p>'+
'<h2>10. Latest Balance Sheet (Sep 3, 2026)</h2><p>Total assets $195.9B · Cash $38.4B · Short-term investments $5.1B · Receivables $36.2B · Inventory $10.4B · Property, plant and equipment $63.3B · Long-term investments $30.0B.</p>'+
'<h2>11. Assets History</h2><p>Total assets: FY2015 $24.1B · FY2020 $53.7B · FY2026 $195.9B.</p>'+
'<h2>12. Assets Year-on-Year</h2><p>FY2026 total assets up 136.6% on the year. Steady 8–19% growth from FY2015–25, then +136.6% in FY2026 (cash +297.9%, receivables +290.7%, long-term investments +1,742.8%).</p>'+
'<h2>13. Top Shareholders</h2><p>Top 5 holders, shares held, Q3 2026 (Sep 30, 2026) vs 2020 <span class="label proven">PROVEN · SEC 13F</span>. 1. '+wl('blackrock','BlackRock')+' 104.8M vs n/r. 2. Vanguard Capital Mgmt 73.9M vs 88.0M. 3. State Street 51.1M vs 46.2M. 4. Invesco 36.4M vs n/r. 5. Capital World 18.3M vs 1.5M — Capital World cut its Micron stake 38.02% in Q3 2026 (from 29.5M to 18.3M shares). Vanguard entity split note: the 2020–2025 figures are the old combined Vanguard; the 2026 figure is Vanguard Capital Mgmt only — the apparent drop is not selling.</p>'+
'<h2>Stakes It Holds</h2><p>One edge: '+wl('anthropic')+' — $1B in the $26B placement <span class="label reported">REPORTED</span> plus a Series H strategic investment, amount n/r (existence <span class="label proven">PROVEN</span>). 0 JVs <span class="label proven">PROVEN</span>. The GlobalWafers convertibles (up to $500M) are pending, not live — see the '+wl('watchlist')+'.</p>'+
'<h2>The Test</h2><p>'+wl('memory','The Memory Shortage')+' test: Micron’s inventory assets going up and staying steady for two quarters — inventory up because Micron is making more, not because nobody is buying. Assets going up alone is <b>not</b> the trigger — a fab under construction doesn’t put memory on the shelf. The trigger needs supply actually arriving. <b>The trigger is still OPEN.</b></p>'+
'<h2>Who’s in Charge</h2><p>Sanjay Mehrotra, chief executive.</p>'+
'<h2>On Camera</h2><p><b>READY</b> (drill 2, Nov 17). In Brenden’s words: we need to see inventory assets go up and stay steady for two quarters. Pocket line: inventory up because they’re making more, not because nobody’s buying.</p>' };

P.tsmc = { title:"TSMC", cat:"Companies", tag:"Taiwan Semiconductor Manufacturing Company · TSM · Monkey · EBITA rank #6",
infobox: ib("TSMC (TSM)", [["Full name","Taiwan Semiconductor Manufacturing Company"],["Tranche","Monkey"],["EBITA rank","#6 of 10 ($90.73B)"],["Fiscal year","Ends Dec 31"],["CEO","C.C. Wei"],["Key project","Fab buildouts (Phoenix, Arizona)"],["Camera line","“TSMC doesn’t rent its fabs. If they’re in, they run it.”"]]),
body:'<p><b>TSMC</b> is the world’s biggest contract chipmaker — a “foundry,” meaning it makes chips designed by other companies ('+wl('apple','Apple')+', '+wl('nvidia','Nvidia')+', and others) rather than selling its own. It reports in Taiwan dollars (NT$) under international accounting rules; the figures here are in US dollars throughout, converted at the revenue-implied exchange rate. TSMC is the supplier side of the AI buildout: it builds the factories (fabs) that make the chips, and its spending is the biggest fab-building program in the index.</p>'+
'<h2>1. At a Glance</h2><p>2026 CapEx (spending on buildings and equipment) is guided at $60–64B, with 70–80% of it going to advanced processes (the newest chip-making technology, 2-nanometre and 3-nanometre). The guide was raised from $52–56B — a real increase of about $8B at the midpoint. Guide midpoint growth vs 2025 (about $41B): +51%. Financing verdict: self-funded, free cash flow squeezed but positive. Signal: <b>GROWING</b>.</p>'+
'<h2>2. Spending</h2><p>CapEx by year ($B): 2022 $36.29 · 2023 $30.45 · 2024 $29.76 · 2025 $40.90 · 2026 guide $60–64B (raised from $52–56B). 2025 was 1.15× 2022; the 2026 guide is 1.7–1.8× 2022. R&amp;D by year ($B): 2022 $5.31 · 2023 $5.96 · 2024 $6.23 · 2025 $7.86. R&amp;D as a share of revenue peaked in 2023 (8.4%) and drifted down to 6.4% in 2025 as revenue grew faster than research spending. 2026 quarterly CapEx: Q1 $10.981B, Q2 $15.588B, Q3 $13.892B — Jan–Sep 2026 CapEx $40.461B, R&amp;D $7.236B. Warning: 2026 is partial-year only — do <b>not</b> compare it to full prior years.</p>'+
'<h2>3. Profitability</h2><p>Gross margin (the share of revenue left after the direct cost of making the product): 2022 59.6% · 2023 54.4% · 2024 56.1% · 2025 59.9% · 2026 not reported. Gross profit / revenue ($B): 2022 $45.19 / $75.88 · 2023 $37.67 / $69.30 · 2024 $50.55 / $90.08 · 2025 $73.31 / $122.42. The margin is identical whether measured in Taiwan dollars or US dollars.</p>'+
'<h2>4. Financial Position</h2><p>Revenue, free cash flow (cash left after spending), cash and short-term investments, and total debt ($B). Total debt means borrowings plus finance leases, not counting operating leases.</p>'+finTable([["2022","$75.88","$17.46","$53.29","$29.77"],["2023","$69.30","$9.19","$54.82","$30.66"],["2024","$90.08","$27.08","$77.50","$32.68"],["2025","$122.42","$31.90","$100.60","$34.07"]])+'<p>Net cash by year: 2022 $23.52B · 2023 $24.16B · 2024 $44.82B · 2025 $66.53B. TSMC has been in net cash throughout — it holds far more cash than debt. Operating cash flow n/r in this table.</p>'+
'<h2>5. Operations</h2><p>These are fabs (chip factories), <b>not</b> data centers.</p><ul><li><b>Fab 1, Phoenix, Arizona</b> — ALREADY BUILT. Part of a $65B+ initial three-fab phase (later tracker reports put the full Arizona program at $165B–$265B). N4 process in volume production since Q4 2024. More than 100 million chips for '+wl('apple','Apple')+' were produced in Arizona in 2026, per Apple. Power (MW) n/r.</li><li><b>Fab 2, Phoenix, Arizona</b> — BEING BUILT. N3 and more advanced processes. Structure complete in 2025, tool move-in under way Oct 2026, volume production Q3 2027. MW n/r.</li><li><b>Fab 3, Phoenix, Arizona</b> — BEING BUILT. N2 / A16 processes. Broke ground Apr 2025, volume production by end of the decade in company-linked reporting. MW n/r.</li><li><b>Fab 4 plus the first Arizona packaging fab, Phoenix</b> — GOING TO BE BUILT. Packaging (CoWoS / 3D-IC — stacking chips together) target 2029 reported; initial construction early 2026. MW n/r.</li></ul>'+
'<h2>6. Outlook</h2><p>2026 CapEx guide $60–64B; the next three years will be significantly higher than the roughly $101B of the prior three years. One analyst model (Citi) has 2027 at $75B and 2028 at $80B. 70–80% of the 2026 guide goes to advanced processes (2nm/3nm) — at the $62B midpoint that is $43.4–49.6B of advanced-process spending (derived). No AI-only dollar split is disclosed. Backlog (RPO — money customers have committed to pay): no comparable figure found — a gap. Cuts or pauses: none. The guide was raised, not cut.</p>'+
'<h2>7. Notes, Risks, and Sources</h2><ul><li>Q3 2026 revenue $46.72B, up 41.2% year-on-year in US dollars. Q3 CapEx $13.84B; $40.64B spent in the first nine months of 2026 vs $40.90B in all of 2025.</li><li>Net cash: cash and short-term investments of NT$3,597.44B at Jun 30, 2026 vs total debt of NT$1,064.95B including leases.</li><li>Gross margin troughed at 54.4% in 2023, recovered to 59.9% in 2025; quarterly margins were in the mid-60s% in 2026 (trailing twelve months about 64–66% through mid-2026).</li></ul>'+
'<h2>8. Consensus — Latest Full Year</h2><p>2025 — Revenue $122.42B · Free cash flow $31.90B · Cash &amp; short-term investments $100.60B · CapEx $40.90B · R&amp;D $7.86B · Gross margin 59.9%. Share price Nov 5, 2026 close: $353.10.</p>'+
'<h2>9. EBITA</h2><p>Rank #6 of 10. Trailing-twelve-months EBITA <b>$90.73B</b> (operating income $90.73B, operating-income basis; amortization not separately stated). Period: Oct 1, 2025 to Sep 30, 2026. EBITA share: 9.7% of the ten-company total.</p>'+
'<h2>10. Latest Balance Sheet (Sep 30, 2026)</h2><p>Total assets $315.3B · Cash $113.6B · Short-term investments $12.4B · Receivables (money owed by customers) $15.2B · Inventory $13.4B · Property, plant and equipment $142.0B · Long-term investments $7.0B · Other $11.7B.</p>'+
'<h2>11. Assets History</h2><p>Total assets: FY2015 $50.5B · FY2020 $98.3B · FY2025 $252.9B · Q3 2026 $315.3B.</p>'+
'<h2>12. Assets Year-on-Year</h2><p>FY2025 total assets up 23.9% on the year (vs FY2024 $204.1B). Total assets grew every year from 2015 to 2025, accelerating in 2020–2021 (+29.8%, +36.6%), then +20.3% / +11.8% / +13.0% / +23.9% in 2022–2025.</p>'+
'<h2>13. Top Shareholders</h2><p>Top 5 holders, shares held (ADR counts — one ADR equals 5 ordinary shares), Q3 2026 vs 2020 <span class="label proven">PROVEN · SEC 13F</span>. 1. FMR (Fidelity) 65,370,233 ADRs vs n/r in 2020. 2. Capital World 33,796,063 vs 38,642,566. 3. Sanders Capital 24,455,974 vs 44,058,914. 4. '+wl('blackrock','BlackRock')+' 19,522,629 ADRs vs n/r in 2020 (the sheet’s Section 13 shows 20,112,852 at Jun 30, 2026 — the Q3 figure is the newer count). 5. Fisher 18,932,587 vs 27,640,000. TSMC is the one company where BlackRock is <b>not</b> the #1 holder — Fidelity is. Reporting dates are mixed (FMR, Capital World, Sanders, Fisher at Sep 30, 2026; BlackRock’s sheet figure at Jun 30, 2026). '+wl('softbank','SoftBank')+' also holds a small, shrinking stake: 565,000 ADRs, $269.8M, trimmed in Q2 2026 <span class="label reported">REPORTED</span>.</p>'+
'<h2>Stakes It Holds</h2><p>TSMC holds stakes in <b>10 partners</b> (cash out — it spent to buy in): '+wl('anthropic')+' $500M in the placement <span class="label reported">REPORTED</span>; about 10% of IMS Nanofabrication <span class="label proven">PROVEN</span> — shared with '+wl('intel')+', which holds the majority; 72.65% of the JASM fab in Kumamoto, Japan <span class="label proven">PROVEN</span>; 40% of the AVSMC image-sensor joint venture (Sony holds 60% and is sole controlling shareholder; split <span class="label reported">REPORTED</span>, agreement and money <span class="label proven">PROVEN</span> — Sony about ¥465B vs TSMC about ¥282B); 70% of the ESMC fab in Dresden, Germany (Bosch, Infineon, and NXP 10% each) <span class="label proven">PROVEN</span>; 38.79% of SSMC in Singapore (NXP majority) <span class="label proven">PROVEN</span>; 41.01% of Xintec <span class="label proven">PROVEN</span>; 67.25% of VisEra <span class="label proven">PROVEN</span>; about 27.6% of VIS at Feb 28, 2026, with a sale of up to 152.0M shares announced May 15, 2026 reducing it to about 19% (announcement <span class="label proven">PROVEN</span>, post-sale figure <span class="label reported">REPORTED</span>); about 34.8% of GUC at Feb 28, 2026 <span class="label proven">PROVEN</span>. Pending, <b>not</b> a live edge: TSMC’s board approved a ceiling of up to $500M in '+wl('openai','OpenAI')+' preferred stock on Nov 10, 2026 (approval <span class="label proven">PROVEN</span>); whether the purchase happened is n/r.</p>'+
'<h2>The Test</h2><p>TSMC has no company-specific sell test in this project — it is the supplier side of the story, and its signal is the fab buildout itself: guide raised, not cut, and three Arizona fabs in flight. Two facts to watch: TSMC’s board approved $40.9B in capital appropriations on Nov 10, 2026 (from the people file on C.C. Wei), and the company’s own rule is that it does not rent out its fabs — if TSMC is in a fab project, TSMC runs the fab, because the process is the company.</p>'+
'<h2>Who’s in Charge</h2><p>C.C. Wei, chief executive officer. His condition on any outside fab project is that TSMC runs the fab — TSMC does not rent its process out.</p>'+
'<h2>On Camera</h2><p><b>READY</b> (drill 6, Nov 18). Camera line: “TSMC doesn’t rent its fabs. If they’re in, they run it.”</p>' };
</script>
